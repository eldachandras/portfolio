gin: 0; width: 100%; box-sizing: border-box; padding: 12px; background: #fff; box-shadow: 0 18px 40px rgba(0,0,0,.3); transform: rotate(0.6deg); flex-shrink: 0; margin-top: 14px;"><span aria-hidden="true" style="position: absolute; left: 50%; top: -12px; width: 110px; height: 28px; margin-left: -55px; background: rgba(240,232,205,.85); box-shadow: 0 1px 2px rgba(0,0,0,.2); transform: rotate(-3deg); z-index: 3;"></span><img src="images/bytsa-news.jpg" alt="Bytsa news list and article page with a latest-news sidebar" style="display: block; width: 100%; height: auto;"></figure><span style="font-family: 'Caveat', cursive; font-size: 26px; color: #9c3a22;">↑ news list · article with a “Latest News” sidebar</span></div></section>

ew, it needed a website that looks as professional as the brand, shows the catalog well and makes custom orders easy.</p><div style="display: flex; flex-direction: column; gap: 18px; margin-top: 8px;"><div style="box-sizing: border-box; padding: 10px 12px; background: #fff3a8; box-shadow: 0 6px 14px rgba(0,0,0,.25); transform: rotate(-1.5deg); font-family: 'Caveat', cursive; font-size: 20px; line-height: 1.15; color: #1b1b1b; flex: 1;"><span style="display: block; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .14em; color: #b5452b; margin-bottom: 4px;">MY PART</span>I designed the whole website in 2 weeks: home, catalog, product detail, custom order and news, built from one shared component library.</div><div style="box-sizing: border-box; padding: 10px 12px; background: #d9ecff; box-shadow: 0 6px 14px rgba(0,0,0,.25); transform: rotate(1.2deg); font-family: 'Caveat', cursive; font-size: 20px; line-height: 1.15; color: #1b1b1b; flex: 1;"><span style="display: block; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .14em; color: #b5452b; margin-bottom: 4px;">HOW I WORKED</span>Alongside a project manager and a developer. I mapped the pages, set up a shared component library, designed each page from it, then handed the designs to the developer.</div></div></section>

100%;"><div style="position: relative; box-sizing: border-box; padding: 10px 12px 12px; background: #ffd9c9; box-shadow: 0 6px 14px rgba(0,0,0,.25); transform: rotate(-1.5deg);"><span aria-hidden="true" style="position: absolute; left: 50%; top: -9px; width: 44px; height: 16px; margin-left: -22px; background: rgba(240,232,205,.85); box-shadow: 0 1px 2px rgba(0,0,0,.2); transform: rotate(-4deg);"></span><span style="display: block; font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 700; letter-spacing: .14em; color: #b5452b; margin-bottom: 4px;">READY-MADE</span><span style="display: block; font-family: 'Caveat', cursive; font-size: 22px; font-weight: 700; line-height: 1.05; color: #1b1b1b;">Shopee</span></div><div style="position: relative; box-sizing: border-box; padding: 10px 12px 12px; background: #dff0c8; box-shadow: 0 6px 14px rgba(0,0,0,.25); transform: rotate(1.5deg);"><span aria-hidden="true" style="position: absolute; left: 50%; top: -9px; width: 44px; height: 16px; margin-left: -22px; background: rgba(240,232,205,.85); box-shadow: 0 1px 2px rgba(0,0,0,.2); transform: rotate(-4deg);"></span><span style="display: block; font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 700; letter-spacing: .14em; color: #b5452b; margin-bottom: 4px;">CUSTOM ORDER</span><span style="display: block; font-family: 'Caveat', cursive; font-size: 22px; font-weight: 700; line-height: 1.05; color: #1b1b1b;">WhatsApp</span></div></div></div></section>
<section id="c3" style="position: relative; width: 100%; box-sizing: border-box; padding: 36px 20px 32px; margin-top: 28px; background-color: #f7f7f4; background-image: repeating-linear-gradient(180deg, transparent 0, transparent 27px, #dfe5ec 27px, #dfe5ec 28px); background-position: 0 18px; border-radius: 4px; box-shadow: 0 10px 24px rgba(60,40,10,.22), 0 5px 0 #e2dccd; display: flex; flex-direction: column; gap: 20px;"><svg aria-hidden="true" width="18" height="44" viewBox="0 0 26 64" fill="none" stroke="#8a8f94" stroke-width="2.4" stroke-linecap="round" style="position: absolute; right: 28px; top: -18px; z-index: 3;"><path d="M8 20 V50 a5 5 0 0 0 10 0 V12 a8 8 0 0 0 -16 0 V46"></path></svg><div style="display: flex;"><span style="display: inline-flex; align-items: center; gap: 8px; padding: 5px 10px; border: 2px solid #b5452b; border-radius: 3px; background: rgba(181,69,43,.07); color: #b5452b; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: .16em; transform: rotate(-2.5deg);"><span>CHAPTER 03</span><span aria-hidden="true" style="width: 1px; align-self: stretch; background: #b5452b; opacity: .6;"></span><span>FOUR KEY MOVES</span></span></div><h2 style="margin: 0; font-size: 30px; line-height: 1.05; letter-spacing: -.02em; font-weight: 800; color: #1b1b1b; max-width: 358px;">Every page points to the <span style="position: relative; display: inline-block; white-space: nowrap;">right<svg aria-hidden="true" viewBox="0 0 120 64" preserveAspectRatio="none" style="position: absolute; left: -8%; top: -18%; width: 116%; height: 136%; overflow: visible; pointer-events: none;"><path d="M10 36 C4 14 58 2 100 10 C124 16 118 52 66 59 C26 64 2 50 14 22" fill="none" stroke="#d64a2b" stroke-width="3" stroke-linecap="round"/></svg></span> place.</h2><p style="margin: 0; font-size: 16px; line-height: 1.6; color: #3a3a3a; max-width: 358px;">Four pages, all built from one shared component library.</p><div style="display: flex; flex-direction: column; gap: 12px; padding-top: 22px; border-top: 1.5px dashed #c9bda3;"><div style="display: flex; align-items: center; gap: 12px;"><span style="flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; background: transparent; border: 2px solid #d64a2b; color: #d64a2b; font-family: 'Caveat', cursive; font-size: 19px; font-weight: 700; display: flex; align-items: center; justify-content: center;">1</span><h3 style="margin: 0; font-size: 21px; line-height: 1.15; font-weight: 800; color: #1b1b1b;">Home: give custom orders their own stage.</h3></div><p style="margin: 0; font-size: 16px; line-height: 1.6; color: #3a3a3a; max-width: 358px;">Between new arrivals and the jersey catalog, a full-width dark band breaks the rhythm of the product grid: “Craft your style, wear your identity”, the four things Bytsa can customize and one button, “Order Custom Now!”.</p><div style="display: flex; flex-wrap: wrap; gap: 8px;"><span style="padding: 3px 10px; border: 1.5px solid #b5452b; border-radius: 999px; color: #b5452b; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .1em;">VISUAL HIERARCHY</span><span style="padding: 3px 10px; border: 1.5px solid #b5452b; border-radius: 999px; color: #b5452b; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .1em;">CONVERSION</span></div><figure style="position: relative; margin: 0; width: 100%; box-sizing: border-box; padding: 6px; background: #fff; box-shadow: 0 10px 24px rgba(0,0,0,.3); transform: rotate(-0.8deg); flex-shrink: 0; margin-top: 10px;"><span aria-hidden="true" style="position: absolute; left: 50%; top: -12px; width: 60px; height: 18px; margin-left: -30px; background: rgba(240,232,205,.85); box-shadow: 0 1px 2px rgba(0,0,0,.2); transform: rotate(-3deg); z-index: 3;"></span><img src="images/bytsa-home.jpg" alt="Bytsa home page: hero, new arrivals and a dark custom-order band" style="display: block; width: 100%; height: auto;"></figure><span style="font-family: 'Caveat', cursive; font-size: 20px; color: #9c3a22;">↑ the custom band sits between two product rows</span></div><div style="display: flex; flex-direction: column; gap: 12px; padding-top: 22px; border-top: 1.5px dashed #c9bda3;"><div style="display: flex; align-items: center; gap: 12px;"><span style="flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; background: transparent; border: 2px solid #d64a2b; color: #d64a2b; font-family: 'Caveat', cursive; font-size: 19px; font-weight: 700; display: flex; align-items: center; justify-content: center;">2</span><h3 style="margin: 0; font-size: 21px; line-height: 1.15; font-weight: 800; color: #1b1b1b;">Catalog: let the jersey be the biggest thing on the card.</h3></div><p style="margin: 0; font-size: 16px; line-height: 1.6; color: #3a3a3a; max-width: 358px;">Each card is mostly photo, with only the name and price below. Category tabs, search and sort sit above the grid. The detail page adds a size guide and links to Shopee, where the purchase happens.</p><div style="display: flex; flex-wrap: wrap; gap: 8px;"><span style="padding: 3px 10px; border: 1.5px solid #b5452b; border-radius: 999px; color: #b5452b; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .1em;">VISUAL HIERARCHY</span><span style="padding: 3px 10px; border: 1.5px solid #b5452b; border-radius: 999px; color: #b5452b; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .1em;">INFORMATION ARCHITECTURE</span></div><figure style="position: relative; margin: 0; width: 100%; box-sizing: border-box; padding: 6px; background: #fff; box-shadow: 0 10px 24px rgba(0,0,0,.3); transform: rotate(0.8deg); flex-shrink: 0; margin-top: 10px;"><span aria-hidden="true" style="position: absolute; left: 50%; top: -12px; width: 60px; height: 18px; margin-left: -30px; background: rgba(240,232,205,.85); box-shadow: 0 1px 2px rgba(0,0,0,.2); transform: rotate(-3deg);
