<article style="grid-column: span 9; display: flex; flex-direction: column; padding: 64px 64px 72px; background: #fbfaf5; border-radius: 3px; box-shadow: 0 16px 36px rgba(0,0,0,.4); font-size: 16px; line-height: 1.65; color: #3a3122;">

<section id="s1" style="display: flex; flex-direction: column; gap: 18px;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§01 — THE BRIEF</span>
<h2 style="margin: 0; font-size: 36px; line-height: 1.14; letter-spacing: -.015em; font-weight: 800; color: #2a1f10;">A growing sportswear brand needed its own website.</h2>
<p style="margin: 0;">Bytsa makes custom jerseys and apparel for teams and communities. As its customer base grew, it needed a website that looks as professional as the brand, shows the catalog well and makes custom orders easy.</p>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px;"><div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; background: #fffdf7; border: 1px solid #d8ccb2; border-top: 4px solid #1f3a68; font-size: 14px; line-height: 1.55;"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .12em; color: #1f3a68;">THE CONSTRAINT</span><span>Sales don’t happen on the site: ready-made products are sold on Shopee, and custom orders start in a WhatsApp chat. The website has to build trust and send each visitor to the right place.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; background: #fffdf7; border: 1px solid #d8ccb2; border-top: 4px solid #1f3a68; font-size: 14px; line-height: 1.55;"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .12em; color: #1f3a68;">MY PART</span><span>I designed the whole website in 2 weeks: home, catalog, product detail, custom order and news, built from one shared component library.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; background: #fffdf7; border: 1px solid #d8ccb2; border-top: 4px solid #1f3a68; font-size: 14px; line-height: 1.55;"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .12em; color: #1f3a68;">HOW I WORKED</span><span>Alongside a project manager and a developer. I mapped the pages, set up a shared component library, designed each page from it, then handed the designs to the developer.</span></div></div>
</section>

<section id="sd1" style="display: flex; flex-direction: column; gap: 18px; margin-top: 56px; padding-top: 56px; border-top: 1.5px dashed #c9bda3;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§02 — DECISION 1/4 · HOME</span>
<h2 style="margin: 0; font-size: 36px; line-height: 1.14; letter-spacing: -.015em; font-weight: 800; color: #2a1f10;">Give custom orders their own stage on the home page.</h2>
<p style="margin: 0;">Between new arrivals and the jersey catalog, a full-width dark band breaks the rhythm of the product grid: “Craft your style, wear your identity”, the four things Bytsa can customize (T-shirt, Jersey, Jacket, Training) and one button, “Order Custom Now!”. Visitors who came for ready-made products still meet the service Bytsa is built on.</p>
<div style="display: flex; flex-wrap: wrap; gap: 6px;"><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Visual Hierarchy</span><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Conversion</span></div>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0;"><img src="images/bytsa-home.jpg" alt="Bytsa home page: hero, new arrivals and a dark custom-order band" style="display: block; width: 100%; height: auto; padding: 10px; background: #ffffff; border: 1px solid #e4dccb; box-sizing: border-box; box-shadow: 0 6px 16px rgba(40,25,5,.12);"><figcaption style="font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.5; color: #6b5a3c;">Home: the custom band sits between two product rows.</figcaption></figure>
</section>

<section id="sd2" style="display: flex; flex-direction: column; gap: 18px; margin-top: 56px; padding-top: 56px; border-top: 1.5px dashed #c9bda3;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§03 — DECISION 2/4 · CATALOG</span>
<h2 style="margin: 0; font-size: 36px; line-height: 1.14; letter-spacing: -.015em; font-weight: 800; color: #2a1f10;">Let the jersey be the biggest thing on the card.</h2>
<p style="margin: 0;">Each product card is mostly photo, with only the name and price below. Category tabs, search and sort sit above the grid, so visitors narrow the list before they scroll. The detail page adds a size guide and links to Shopee, where the purchase happens.</p>
<div style="display: flex; flex-wrap: wrap; gap: 6px;"><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Visual Hierarchy</span><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Information Architecture</span></div>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0;"><img src="images/bytsa-product.jpg" alt="Bytsa product catalog with category tabs and a product detail page" style="display: block; width: 100%; height: auto; padding: 10px; background: #ffffff; border: 1px solid #e4dccb; box-sizing: border-box; box-shadow: 0 6px 16px rgba(40,25,5,.12);"><figcaption style="font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.5; color: #6b5a3c;">Catalog with tabs and sort · product detail with size guide and Shopee link.</figcaption></figure>
</section>

<section id="sd3" style="display: flex; flex-direction: column; gap: 18px; margin-top: 56px; padding-top: 56px; border-top: 1.5px dashed #c9bda3;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§04 — DECISION 3/4 · CUSTOM ORDER</span>
<h2 style="margin: 0; font-size: 36px; line-height: 1.14; letter-spacing: -.015em; font-weight: 800; color: #2a1f10;">Answer the doubts before the chat starts.</h2>
<p style="margin: 0;">A custom jersey is ordered by talking to the team, so this page prepares visitors for that conversation. The hero names what can be customized and opens WhatsApp. Three short promises follow (Easy Communication, Endless Design, Best Product Quality), then jerseys Bytsa made for real teams, so visitors see the work before they commit to a chat.</p>
<div style="display: flex; flex-wrap: wrap; gap: 6px;"><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Conversion</span><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Storytelling</span></div>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; width: 62%; align-self: center;"><img src="images/bytsa-custom-page.jpg" alt="Bytsa custom order page with a WhatsApp button, three promises and example team jerseys" style="display: block; width: 100%; height: auto; padding: 10px; background: #ffffff; border: 1px solid #e4dccb; box-sizing: border-box; box-shadow: 0 6px 16px rgba(40,25,5,.12);"><figcaption style="font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.5; color: #6b5a3c;">Custom page: offer → promises → real examples.</figcaption></figure>
</section>

<section id="sd4" style="display: flex; flex-direction: column; gap: 18px; margin-top: 56px; padding-top: 56px; border-top: 1.5px dashed #c9bda3;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§05 — DECISION 4/4 · NEWS</span>
<h2 style="margin: 0; font-size: 36px; line-height: 1.14; letter-spacing: -.015em; font-weight: 800; color: #2a1f10;">Give the community a reason to come back.</h2>
<p style="margin: 0;">News uses a simple editorial layout: one featured story, two smaller ones, then the full list. Inside an article, a “Latest News” column keeps the next story in view. It gives Bytsa room for community stories and promos, not only products.</p>
<div style="display: flex; flex-wrap: wrap; gap: 6px;"><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Retention</span><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Information Architecture</span></div>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0;"><img src="images/bytsa-news.jpg" alt="Bytsa news list and article page with a latest-news sidebar" style="display: block; width: 100%; height: auto; padding: 10px; background: #ffffff; border: 1px solid #e4dccb; box-sizing: border-box; box-shadow: 0 6px 16px rgba(40,25,5,.12);"><figcaption style="font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.5; color: #6b5a3c;">News list · article with a “Latest News” sidebar.</figcaption></figure>
</section>

<section id="simp" style="display: flex; flex-direction: column; gap: 18px; margin-top: 56px; padding-top: 56px; border-top: 1.5px dashed #c9bda3;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§06 — IMPACT</span>
<h2 style="margin: 0; font-size: 36px; line-height: 1.14; letter-spacing: -.015em; font-weight: 800; color: #2a1f10;">A storefront that points to the right place.</h2>

<article style="width: 100%; margin-top: 20px; box-sizing: border-box; display: flex; flex-direction: column; padding: 32px 20px 36px; background: #fbfaf5; border-radius: 3px; box-shadow: 0 12px 28px rgba(0,0,0,.4); font-size: 15px; line-height: 1.65; color: #3a3122;">

<section id="m1" style="display: flex; flex-direction: column; gap: 14px;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§01 — THE BRIEF</span>
<h2 style="margin: 0; font-size: 25px; line-height: 1.14; letter-spacing: -.015em; font-weight: 800; color: #2a1f10;">A growing sportswear brand needed its own website.</h2>
<p style="margin: 0;">Bytsa makes custom jerseys and apparel for teams and communities. As its customer base grew, it needed a website that looks as professional as the brand, shows the catalog well and makes custom orders easy.</p>
<div style="display: flex; flex-direction: column; gap: 10px;"><div style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; background: #fffdf7; border: 1px solid #d8ccb2; border-top: 4px solid #1f3a68; font-size: 14px; line-height: 1.55;"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .12em; color: #1f3a68;">THE CONSTRAINT</span><span>Sales don’t happen on the site: ready-made products are sold on Shopee, and custom orders start in a WhatsApp chat. The website has to build trust and send each visitor to the right place.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; background: #fffdf7; border: 1px solid #d8ccb2; border-top: 4px solid #1f3a68; font-size: 14px; line-height: 1.55;"><span style="font-family: &quot;JetBrains Mono&quot;, monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.12em; color: rgb(31, 58, 104)">MY PART</span><span>I designed the whole website in 2 weeks: home, catalog, product detail, custom order and news, built from one shared component library.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; background: #fffdf7; border: 1px solid #d8ccb2; border-top: 4px solid #1f3a68; font-size: 14px; line-height: 1.55;"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .12em; color: #1f3a68;">HOW I WORKED</span><span>Alongside a project manager and a developer. I mapped the pages, set up a shared component library, designed each page from it, then handed the designs to the developer.</span></div></div>
</section>

<section id="md1" style="display: flex; flex-direction: column; gap: 14px; margin-top: 36px; padding-top: 36px; border-top: 1.5px dashed #c9bda3;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§02 — DECISION 1/4 · HOME</span>
<h2 style="margin: 0; font-size: 25px; line-height: 1.14; letter-spacing: -.015em; font-weight: 800; color: #2a1f10;">Give custom orders their own stage on the home page.</h2>
<p style="margin: 0;">Between new arrivals and the jersey catalog, a full-width dark band breaks the rhythm of the product grid: “Craft your style, wear your identity”, the four things Bytsa can customize (T-shirt, Jersey, Jacket, Training) and one button, “Order Custom Now!”. Visitors who came for ready-made products still meet the service Bytsa is built on.</p>
<div style="display: flex; flex-wrap: wrap; gap: 6px;"><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Visual Hierarchy</span><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Conversion</span></div>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0;"><img src="images/bytsa-home.jpg" alt="Bytsa home page: hero, new arrivals and a dark custom-order band" style="display: block; width: 100%; height: auto; padding: 6px; background: #ffffff; border: 1px solid #e4dccb; box-sizing: border-box; box-shadow: 0 6px 16px rgba(40,25,5,.12);"><figcaption style="font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.5; color: #6b5a3c;">Home: the custom band sits between two product rows.</figcaption></figure>
</section>

<section id="md2" style="display: flex; flex-direction: column; gap: 14px; margin-top: 36px; padding-top: 36px; border-top: 1.5px dashed #c9bda3;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§03 — DECISION 2/4 · CATALOG</span>
<h2 style="margin: 0; font-size: 25px; line-height: 1.14; letter-spacing: -.015em; font-weight: 800; color: #2a1f10;">Let the jersey be the biggest thing on the card.</h2>
<p style="margin: 0;">Each product card is mostly photo, with only the name and price below. Category tabs, search and sort sit above the grid, so visitors narrow the list before they scroll. The detail page adds a size guide and links to Shopee, where the purchase happens.</p>
<div style="display: flex; flex-wrap: wrap; gap: 6px;"><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Visual Hierarchy</span><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Information Architecture</span></div>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0;"><img src="images/bytsa-product.jpg" alt="Bytsa product catalog with category tabs and a product detail page" style="display: block; width: 100%; height: auto; padding: 6px; background: #ffffff; border: 1px solid #e4dccb; box-sizing: border-box; box-shadow: 0 6px 16px rgba(40,25,5,.12);"><figcaption style="font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.5; color: #6b5a3c;">Catalog with tabs and sort · product detail with size guide and Shopee link.</figcaption></figure>
</section>

<section id="md3" style="display: flex; flex-direction: column; gap: 14px; margin-top: 36px; padding-top: 36px; border-top: 1.5px dashed #c9bda3;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§04 — DECISION 3/4 · CUSTOM ORDER</span>
<h2 style="margin: 0; font-size: 25px; line-height: 1.14; letter-spacing: -.015em; font-weight: 800; color: #2a1f10;">Answer the doubts before the chat starts.</h2>
<p style="margin: 0;">A custom jersey is ordered by talking to the team, so this page prepares visitors for that conversation. The hero names what can be customized and opens WhatsApp. Three short promises follow (Easy Communication, Endless Design, Best Product Quality), then jerseys Bytsa made for real teams, so visitors see the work before they commit to a chat.</p>
<div style="display: flex; flex-wrap: wrap; gap: 6px;"><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Conversion</span><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Storytelling</span></div>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0;"><img src="images/bytsa-custom-page.jpg" alt="Bytsa custom order page with a WhatsApp button, three promises and example team jerseys" style="display: block; width: 100%; height: auto; padding: 6px; background: #ffffff; border: 1px solid #e4dccb; box-sizing: border-box; box-shadow: 0 6px 16px rgba(40,25,5,.12);"><figcaption style="font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.5; color: #6b5a3c;">Custom page: offer → promises → real examples.</figcaption></figure>
</section>

<section id="md4" style="display: flex; flex-direction: column; gap: 14px; margin-top: 36px; padding-top: 36px; border-top: 1.5px dashed #c9bda3;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§05 — DECISION 4/4 · NEWS</span>
<h2 style="margin: 0; font-size: 25px; line-height: 1.14; letter-spacing: -.015em; font-weight: 800; color: #2a1f10;">Give the community a reason to come back.</h2>
<p style="margin: 0;">News uses a simple editorial layout: one featured story, two smaller ones, then the full list. Inside an article, a “Latest News” column keeps the next story in view. It gives Bytsa room for community stories and promos, not only products.</p>
<div style="display: flex; flex-wrap: wrap; gap: 6px;"><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Retention</span><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Information Architecture</span></div>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0;"><img src="images/bytsa-news.jpg" alt="Bytsa news list and article page with a latest-news sidebar" style="display: block; width: 100%; height: auto; padding: 6px; background: #ffffff; border: 1px solid #e4dccb; box-sizing: border-box; box-shadow: 0 6px 16px rgba(40,25,5,.12);"><figcaption style="font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.5; color: #6b5a3c;">News list · article with a “Latest News” sidebar.</figcaption></figure>
</section>

<section id="mimp" style="display: flex; flex-direction: column; gap: 14px; margin-top: 36px; padding-top: 36px; border-top: 1.5px dashed #c9bda3;">

<script>(function () {
  var app = document.getElementById('app');
  var mode = null, cur = null;
  function pick() { return window.innerWidth < 900 ? 'm' : 'd'; }
  function tpl(m, i) { var t = document.getElementById('v-' + m + '-' + i); return t ? t.content.firstElementChild : null; }
  function scale() {
    var w = mode === 'd' ? 1440 : 390;
    var s = Math.min(window.innerWidth / w, mode === 'd' ? 1 : 1.6);
    app.style.zoom = s;
  }
  function jump() {
    if (!location.hash) return;
    var el = document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (el) el.scrollIntoView();
  }
  function mount() {
    mode = pick(); cur = null;
    app.innerHTML = '';
    app.appendChild(tpl(mode, 0).cloneNode(true));
    scale();
    jump();
    if (typeof spy === 'function') spy();
  }
  // update the live DOM to match a pre-rendered state, keeping elements so CSS transitions run
  function morph(a, b) {
    if (a.nodeType === 3) { if (a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue; return; }
    if (a.nodeType !== 1) return;
    var i, at;
    for (i = a.attributes.length - 1; i >= 0; i--) { at = a.attributes[i].name; if (!b.hasAttribute(at)) a.removeAttribute(at); }
    for (i = 0; i < b.attributes.length; i++) { at = b.attributes[i]; if (a.getAttribute(at.name) !== at.value) a.setAttribute(at.name, at.value); }
    var ac = a.childNodes, bc = b.childNodes;
    if (ac.length !== bc.length) { a.innerHTML = b.innerHTML; return; }
    for (i = 0; i < ac.length; i++) {
      if (ac[i].nodeType !== bc[i].nodeType || ac[i].nodeName !== bc[i].nodeName) { a.replaceChild(bc[i].cloneNode(true), ac[i]); }
      else morph(ac[i], bc[i]);
    }
  }
  function setCur(k) {
    if (k === cur) return;
    var n = tpl(mode, k == null ? 0 : k + 1);
    if (!n) return;
    cur = k;
    morph(app.firstElementChild, n);
    spy();
  }
  function idxOf(el, sel) {
    var t = el && el.closest ? el.closest(sel) : null;
    if (!t) return -1;
    return Array.prototype.indexOf.call(app.querySelectorAll(sel), t);
  }
  // the whole folder reacts (desktop hover), like on the canvas; falls back to the tab
  function tabIndex(el) {
    var j = idxOf(el, '[data-row]');
    return j >= 0 ? j : idxOf(el, '[data-tab]');
  }
  app.addEventListener('mouseover', function (e) {
    if (mode !== 'd') return;
    var j = tabIndex(e.target);
    if (j >= 0) { setCur(j); return; }
    var zone = e.target.closest && e.target.closest('[data-leave]');
    if (!zone && cur != null) setCur(null);
  });
  app.addEventListener('focusin', function (e) { if (mode === 'd') { var j = tabIndex(e.target); if (j >= 0) setCur(j); } });
  app.addEventListener('click', function (e) {
    var j = tabIndex(e.target);

  // profile photo: no context menu, drag or long-press save (a light deterrent only)
  function isPhoto(t) { return t && t.tagName === 'IMG' && /elda-photo/.test(t.getAttribute('src') || ''); }
  app.addEventListener('contextmenu', function (e) { if (isPhoto(e.target)) e.preventDefault(); });
  app.addEventListener('dragstart', function (e) { if (isPhoto(e.target)) e.preventDefault(); });
  // header folder tabs: lift the tab of the section being read
  function spy() {
    var tabs = app.querySelectorAll('.tabnav a'); if (!tabs.length) return;
    var best = 0, y = window.innerHeight * 0.35;
    for (var i = 0; i < tabs.length; i++) {
      var sec = document.getElementById(tabs[i].getAttribute('href').slice(1));
      if (sec && sec.getBoundingClientRect().top <= y) best = i;
    }
    for (var k = 0; k < tabs.length; k++) tabs[k].className = k === best ? 'on' : '';
  }

  window.addEventListener('hashchange', jump);
  window.addEventListener('resize', function () { if (pick() !== mode) mount(); else scale(); });
  mount();
})();
</script>
