use, mortality and weight gain, to their unit head and the farmers. These reports were written by hand and sent via WhatsApp, which led to data inaccuracies and wasted time.</p><p style="margin: 0; font-size: 20px; line-height: 1.6; color: #3a3a3a; max-width: 760px;">I was responsible for designing a faster, more reliable way for PPLs to share performance reports directly from the Chickin app, minimizing manual errors and improving data consistency.</p><div style="display: flex; align-items: center; gap: 22px; margin-top: 8px;"><figure style="position: relative; margin: 0; width: 300px; box-sizing: border-box; padding: 12px; background: #fff; box-shadow: 0 18px 40px rgba(0,0,0,.3); transform: rotate(2deg); flex-shrink: 0; "><span aria-hidden="true" style="position: absolute; left: 50%; top: -12px; width: 110px; height: 28px; margin-left: -55px; background: rgba(240,232,205,.85); box-shadow: 0 1px 2px rgba(0,0,0,.2); transform: rotate(-3deg); z-index: 3;"></span><img src="images/chickin-wa.jpg" alt="A performance report typed out in a WhatsApp chat" style="display: block; width: 100%; height: auto;"><figcaption style="padding: 10px 2px 0; font-family: 'Caveat', cursive; font-size: 26px; line-height: 1.1; color: #1b1b1b;">typed out by hand, sent to WhatsApp</figcaption></figure><div style="flex: 1; display: flex; flex-direction: column; gap: 22px;"><span style="font-family: 'Caveat', cursive; font-size: 28px; color: #9c3a22; padding-left: 68px;">What we found, from observations and interviews:</span><div style="display: flex; gap: 12px; align-items: center;"><svg aria-hidden="true" width="56" height="26" viewBox="0 0 60 26" fill="none" stroke="#2a2a2a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; "><path d="M58 6 C40 20 22 22 6 14"></path><path d="M14 8 L5 14 L14 19"></path></svg><span style="flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%; background: transparent; border: 2px solid #d64a2b; color: #d64a2b; font-family: 'Caveat', cursive; font-size: 21px; font-weight: 700; display: flex; align-items: center; justify-content: center;">1</span><div style="box-sizing: border-box; padding: 14px 18px; background: #fff3a8; box-shadow: 0 6px 14px rgba(0,0,0,.25); transform: rotate(-1.5deg); font-family: 'Caveat', cursive; font-size: 23px; line-height: 1.15; color: #1b1b1b; flex: 1;"><span style="display: block; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: .14em; color: #b5452b; margin-bottom: 4px;">P-01</span>PPLs juggle feed checks, consultations and logistics on site, so reporting becomes a secondary burden.</div></div><div style="display: flex; gap: 12px; align-items: center;"><svg aria-hidden="true" width="56" height="26" viewBox="0 0 60 26" fill="none" stroke="#2a2a2a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; "><path d="M58 6 C40 20 22 22 6 14"></path><path d="M14 8 L5 14 L14 19"></path></svg><span style="flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%; background: transparent; border: 2px solid #d64a2b; color: #d64a2b; font-family: 'Caveat', cursive; font-size: 21px; font-weight: 700; display: flex; align-items: center; justify-content: center;">2</span><div style="box-sizing: border-box; padding: 14px 18px; background: #ffd9c9; box-shadow: 0 6px 14px rgba(0,0,0,.25); transform: rotate(1.2deg); font-family: 'Caveat', cursive; font-size: 23px; line-height: 1.15; color: #1b1b1b; flex: 1;"><span style="display: block; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: .14em; color: #b5452b; margin-bottom: 4px;">P-02</span>Manual calculations often caused lost or inaccurate data.</div></div><div style="display: flex; gap: 12px; align-items: center;"><svg aria-hidden="true" width="56" height="26" viewBox="0 0 60 26" fill="none" stroke="#2a2a2a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; "><path d="M58 6 C40 20 22 22 6 14"></path><path d="M14 8 L5 14 L14 19"></path></svg><span style="flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%; background: transparent; border: 2px solid #d64a2b; color: #d64a2b; font-family: 'Caveat', cursive; font-size: 21px; font-weight: 700; display: flex; align-items: center; justify-content: center;">3</span><div style="box-sizing: border-box; padding: 14px 18px; background: #d9ecff; box-shadow: 0 6px 14px rgba(0,0,0,.25); transform: rotate(-1deg); font-family: 'Caveat', cursive; font-size: 23px; line-height: 1.15; color: #1b1b1b; flex: 1;"><span style="display: block; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: .14em; color: #b5452b; margin-bottom: 4px;">P-03</span>Reporting felt repetitive and disconnected from their actual workflow.</div></div></div></div></section>

shadow: 0 1px 2px rgba(0,0,0,.2); transform: rotate(-3deg); z-index: 3;"></span><img src="images/chickin-r3.jpg" alt="Field officer entering data on a phone" style="display: block; width: 100%; height: auto;"><figcaption style="padding: 10px 2px 0; font-family: 'Caveat', cursive; font-size: 26px; line-height: 1.1; color: #1b1b1b;">Performance calculation</figcaption></figure><figure style="position: relative; margin: 0; width: 100%; box-sizing: border-box; padding: 12px; background: #fff; box-shadow: 0 18px 40px rgba(0,0,0,.3); transform: rotate(2deg); flex-shrink: 0; "><span aria-hidden="true" style="position: absolute; left: 50%; top: -12px; width: 110px; height: 28px; margin-left: -55px; background: rgba(240,232,205,.85); box-shadow: 0 1px 2px rgba(0,0,0,.2); transform: rotate(-3deg); z-index: 3;"></span><img src="images/chickin-r4.jpg" alt="Field officer talking with a farmer" style="display: block; width: 100%; height: auto;"><figcaption style="padding: 10px 2px 0; font-family: 'Caveat', cursive; font-size: 26px; line-height: 1.1; color: #1b1b1b;">Farmer consultation</figcaption></figure></div><div style="box-sizing: border-box; padding: 14px 18px; background: #ffd9c9; box-shadow: 0 6px 14px rgba(0,0,0,.25); transform: rotate(-1.5deg); font-family: 'Caveat', cursive; font-size: 26px; line-height: 1.15; color: #1b1b1b; align-self: flex-end; margin-top: 8px;">Reporting comes last,<br>after all of this.</div></section>
<section id="c3" style="position: relative; width: 890px; box-sizing: border-box; padding: 56px 56px 52px; margin-top: 64px; background-color: #f7f7f4; background-image: repeating-linear-gradient(180deg, transparent 0, transparent 31px, #dfe5ec 31px, #dfe5ec 32px); background-position: 0 30px; border-radius: 4px; box-shadow: 0 14px 34px rgba(60,40,10,.22), 8px 8px 0 #e2dccd; display: flex; flex-direction: column; gap: 28px;"><svg aria-hidden="true" width="26" height="64" viewBox="0 0 26 64" fill="none" stroke="#8a8f94" stroke-width="2.4" stroke-linecap="round" style="position: absolute; right: 56px; top: -26px; z-index: 3;"><path d="M8 20 V50 a5 5 0 0 0 10 0 V12 a8 8 0 0 0 -16 0 V46"></path></svg><div style="display: flex;"><span style="display: inline-flex; align-items: center; gap: 12px; padding: 7px 14px; border: 3px solid #b5452b; border-radius: 3px; background: rgba(181,69,43,.07); color: #b5452b; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; letter-spacing: .16em; transform: rotate(-2.5deg);"><span>CHAPTER 03</span><span aria-hidden="true" style="width: 1px; align-self: stretch; background: #b5452b; opacity: .6;"></span><span>THREE KEY MOVES</span></span></div><h2 style="margin: 0; font-size: 56px; line-height: 1.05; letter-spacing: -.02em; font-weight: 800; color: #1b1b1b; max-width: 900px;">Share Performance, in <span style="position: relative; display: inline-block; white-space: nowrap;">three<svg aria-hidden="true" viewBox="0 0 120 64" preserveAspectRatio="none" style="position: absolute; left: -8%; top: -18%; width: 116%; height: 136%; overflow: visible; pointer-events: none;"><path d="M10 36 C4 14 58 2 100 10 C124 16 118 52 66 59 C26 64 2 50 14 22" fill="none" stroke="#d64a2b" stroke-width="3" stroke-linecap="round"></path></svg></span> moves.</h2><p style="margin: 0; font-size: 20px; line-height: 1.6; color: #3a3a3a; max-width: 760px;">The new feature works inside the flow PPLs already use, instead of adding a new one.</p><div style="display: flex; flex-direction: column; gap: 16px; padding-top: 30px; border-top: 1.5px dashed #c9bda3;"><div style="display: flex; align-items: center; gap: 12px;"><span style="flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%; background: transparent; border: 2px solid #d64a2b; color: #d64a2b; font-family: 'Caveat', cursive; font-size: 21px; font-weight: 700; display: flex; align-items: center; justify-content: center;">1</span><h3 style="margin: 0; font-size: 30px; line-height: 1.15; font-weight: 800; color: #1b1b1b;">Put sharing where the data already is.</h3></div><p style="margin: 0; font-size: 20px; line-height: 1.6; color: #3a3a3a; max-width: 760px;">One “Bagikan” button on the Data harian tab, next to the daily entries PPLs already fill in. No new screen to learn: the report starts from the data they just entered.</p><div style="display: flex; flex-wrap: wrap; gap: 8px;"><span style="padding: 3px 10px; border: 1.5px solid #b5452b; border-radius: 999px; color: #b5452b; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: .1em;">CONTEXTUAL DESIGN</span><span style="padding: 3px 10px; border: 1.5px solid #b5452b; border-radius: 999px; color: #b5452b; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: .1em;">AFFORDANCE</span></div><figure style="position: relative; margin: 0; width: 100%; box-sizing: border-box; padding: 12px; background: #fff; box-shadow: 0 18px 40px rgba(0,0,0,.3); transform: rotate(-0.8deg); flex-shrink: 0; margin-top: 14px;"><span aria-hidden="true" style="position: absolute; left: 50%; top: -12px; width: 110px; height: 28px; margin-left: -55px; background: rgba(240,232,205,.85); box-shadow: 0 1px 2px rgba(0,0,0,.2); transform: rotate(-3deg); z-index: 3;"></span><img src="images/chickin-beforeafter.jpg" alt="Before and after: the daily data screen gains a Share button" style="display: block; width: 100%; height: auto;"></figure><span style="font-family: 'Caveat', cursive; font-size: 26px; color: #9c3a22;">↑ before → after: “Bagikan” beside the daily entries</span></div><div style="display: flex; flex-direction: column; gap: 16px; padding-top: 30px; border-top: 1.5px dashed #c9bda3;"><div style="display: flex; align-items: center; gap: 12px;"><span style="flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%; background: transparent; border: 2px solid #d64a2b; color: #d64a2b; font-family: 'Caveat', cursive; font-size: 21px; font-weight: 700; display: flex; align-items: center; justify-content: center;">2</span><h3 style="margin: 0; font-size: 30px; line-height: 1.15; font-weight: 800; color: #1b1b1b;">Choose the days, send to any app.</h3></div><p style="margin: 0; font-size: 20px; line-height: 1.6; color: #3a3a3a; max-width: 760px;">Each daily entry gets a checkbox, with “Pilih semua” for the whole period. The share button only becomes active once something is picked, then the phone’s share sheet opens (WhatsApp, Telegram and more).</p><div style="display: flex; flex-wrap: wrap; gap: 8px;"><span style="padding: 3px 10px; border: 1.5px solid #b5452b; border-radius: 999px; color: #b5452b; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: .1em;">USER CONTROL</span><span style="padding: 3px 10px; border: 1.5px solid #b5452b; border-radius: 999px; color: #b5452b; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: .1em;">ERROR PREVENTION</span></div><figure style="position: relative; margin: 0; width: 100%; box-sizing: border-box; padding: 12px; background: #fff; box-shadow: 0 18px 40px rgba(0,0,0,.3); transform: rotate(0.8deg); flex-shrink: 0; margin-top: 14px;"><span aria-hidden="true" style="position: absolute; left: 50%; top: -12px; width: 110px; height: 28px; margin-left: -55px; background: rgba(240,232,205,.85); box-shadow: 0 1px 2px rgba(0,0,0,.2); transform: rotate(-3deg); z-index: 3;"></span><img src="images/chickin-screens.jpg" alt="Four screens: tap Share, select daily data, tap Share, choose a platform" style="display: block; width: 100%; height: auto;"></figure><span style="font-family: 'Caveat', cursive; font-size: 26px; color: #9c3a22;">↑ tap Bagikan → select days → Bagikan → choose an app</span></div><div style="display: flex; flex-direction: column; gap: 16px; padding-top: 30px; border-top: 1.5px dashed #c9bda3;"><div style="display: flex; align-items: center; gap: 12px;"><span style="flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%; background: transparent; border: 2px solid #d64a2b; color: #d64a2b; font-family: 'Caveat', cursive; font-size: 21px; font-weight: 700; display: flex; align-items: center; justify-content: center;">3</span><h3 style="margin: 0; font-size: 30px; line-height: 1.15; font-weight: 800; color: #1b1b1b;">Let the system do the math.</h3></div><p style="margin: 0; font-size: 20px; line-height: 1.6; color: #3a3a3a; max-width: 760px;">The report puts the farm, location and field officer on top, then mortality and feed use per day. Depletion, body weight, FCR and remaining feed are calculated by the system. Every farm’s report follows the same layout.</p><div style="display: flex; flex-wrap: wrap; gap: 8px;"><span style="padding: 3px 10px; border: 1.5px solid #b5452b; border-radius: 999px; color: #b5452b; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: .1em;">CLARITY</span><span style="padding: 3px 10px; border: 1.5px solid #b5452b; border-radius: 999px; color: #b5452b; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: .1em;">ERROR PREVENTION</span></div><figure style="position: relative; margin: 0; width: 100%; box-sizing: border-box; padding: 12px; background: #fff; box-shadow: 0 18px 40px rgba(0,0,0,.3); transform: rotate(-0.6deg); flex-shrink: 0; margin-top: 14px;"><span aria-hidden="true" style="position: absolute; left: 50%; top: -12px; width: 110px; height: 28px; margin-left: -55px; background: rgba(240,232,205,.85); box-shadow: 0 1px 2px rgba(0,0,0,.2); transform: rotate(-3deg); z-index: 3;"></span><img src="images/chickin-report.jpg" alt="Two generated performance reports for Wahono Farm" style="display: block; width: 100%; height: auto;"></figure><span style="font-family: 'Caveat', cursive; font-size: 26px; color: #9c3a22;">↑ a generated two-page report for Wahono Farm</span></div></section>

tyle="font-size: 21px; font-weight: 700; color: #2a1f10;">Data recorded during the visit becomes the report</span></div><div style="display: grid; grid-template-columns: 200px 1fr 40px 1fr; gap: 16px; align-items: center; padding: 22px 0; border-top: 1px solid #e4dccb;"><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: .14em; color: #6b5a3c;">NO MANUAL FORMULAS</span><span style="font-size: 18px; color: #9a8f7c; text-decoration: line-through; text-decoration-color: #b5452b; text-decoration-thickness: 2px;">Totals worked out by hand</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 22px; color: #b5452b;">→</span><span style="font-size: 21px; font-weight: 700; color: #2a1f10;">Depletion and FCR calculated by the system</span></div><div style="display: grid; grid-template-columns: 200px 1fr 40px 1fr; gap: 16px; align-items: center; padding: 22px 0; border-top: 1px solid #e4dccb;"><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: .14em; color: #6b5a3c;">ONE FORMAT</span><span style="font-size: 18px; color: #9a8f7c; text-decoration: line-through; text-decoration-color: #b5452b; text-decoration-thickness: 2px;">Free-text WhatsApp messages</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 22px; color: #b5452b;">→</span><span style="font-size: 21px; font-weight: 700; color: #2a1f10;">The same structured report for every farm</span></div></div><span style="position: absolute; right: 72px; top: 64px; padding: 10px 16px; border: 3px solid #b5452b; color: #b5452b; font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700; letter-spacing: .16em; transform: rotate(-8deg);">CASE CLOSED</span></section>

<section id="c1" style="position: relative; width: 100%; box-sizing: border-box; padding: 36px 20px 32px; margin-top: 28px; background-color: #f7f7f4; background-image: repeating-linear-gradient(180deg, transparent 0, transparent 27px, #dfe5ec 27px, #dfe5ec 28px); background-position: 0 18px; border-radius: 4px; box-shadow: 0 10px 24px rgba(60,40,10,.22), 0 5px 0 #e2dccd; display: flex; flex-direction: column; gap: 20px;"><svg aria-hidden="true" width="18" height="44" viewBox="0 0 26 64" fill="none" stroke="#8a8f94" stroke-width="2.4" stroke-linecap="round" style="position: absolute; right: 28px; top: -18px; z-index: 3;"><path d="M8 20 V50 a5 5 0 0 0 10 0 V12 a8 8 0 0 0 -16 0 V46"></path></svg><div style="display: flex;"><span style="display: inline-flex; align-items: center; gap: 8px; padding: 5px 10px; border: 2px solid #b5452b; border-radius: 3px; background: rgba(181,69,43,.07); color: #b5452b; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: .16em; transform: rotate(-2.5deg);"><span>CHAPTER 01</span><span aria-hidden="true" style="width: 1px; align-self: stretch; background: #b5452b; opacity: .6;"></span><span>THE CASE</span></span></div><h2 style="margin: 0; font-size: 30px; line-height: 1.05; letter-spacing: -.02em; font-weight: 800; color: #1b1b1b; max-width: 358px;">Daily farm reports, typed by hand into <span style="position: relative; display: inline-block; white-space: nowrap;">WhatsApp.<svg aria-hidden="true" viewBox="0 0 120 64" preserveAspectRatio="none" style="position: absolute; left: -8%; top: -18%; width: 116%; height: 136%; overflow: visible; pointer-events: none;"><path d="M10 36 C4 14 58 2 100 10 C124 16 118 52 66 59 C26 64 2 50 14 22" fill="none" stroke="#d64a2b" stroke-width="3" stroke-linecap="round"></path></svg></span></h2><p style="margin: 0; font-size: 16px; line-height: 1.6; color: #3a3a3a; max-width: 358px;">Field officers (PPL) at Chickin Smartfarm report daily performance, such as feed use, mortality and weight gain, to their unit head and the farmers. These reports were written by hand and sent via WhatsApp, which led to data inaccuracies and wasted time.</p><p style="margin: 0; font-size: 16px; line-height: 1.6; color: #3a3a3a; max-width: 358px;">I was responsible for designing a faster, more reliable way for PPLs to share performance reports directly from the Chickin app, minimizing manual errors and improving data consistency.</p><div style="display: flex; flex-direction: column; gap: 18px; margin-top: 8px;"><div style="align-self: center;"><figure style="position: relative; margin: 0; width: 220px; box-sizing: border-box; padding: 6px; background: #fff; box-shadow: 0 10px 24px rgba(0,0,0,.3); transform: rotate(1.5deg); flex-shrink: 0; "><span aria-hidden="true" style="position: absolute; left: 50%; top: -12px; width: 60px; height: 18px; margin-left: -30px; background: rgba(240,232,205,.85); box-shadow: 0 1px 2px rgba(0,0,0,.2); transform: rotate(-3deg); z-index: 3;"></span><img src="images/chickin-wa.jpg" alt="A performance report typed out in a WhatsApp chat" style="display: block; width: 100%; height: auto;"><figcaption style="padding: 6px 2px 0; font-family: 'Caveat', cursive; font-size: 20px; line-height: 1.1; color: #1b1b1b;">typed out by hand, sent to WhatsApp</figcaption></figure></div><span style="font-family: 'Caveat', cursive; font-size: 22px; color: #9c3a22;">What we found, from observations and interviews:</span><div style="display: flex; gap: 10px; align-items: flex-start;"><span style="flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; background: transparent; border: 2px solid #d64a2b; color: #d64a2b; font-family: 'Caveat', cursive; font-size: 19px; font-weight: 700; display: flex; align-items: center; justify-content: center;">1</span><div style="box-sizing: border-box; padding: 10px 12px; background: #fff3a8; box-shadow: 0 6px 14px rgba(0,0,0,.25); transform: rotate(-1.5deg); font-family: 'Caveat', cursive; font-size: 20px; line-height: 1.15; color: #1b1b1b; flex: 1;"><span style="display: block; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .14em; color: #b5452b; margin-bottom: 4px;">P-01</span>PPLs juggle feed checks, consultations and logistics on site, so reporting becomes a secondary burden.</div></div><div style="display: flex; gap: 10px; align-items: flex-start;"><span style="flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; background: transparent; border: 2px solid #d64a2b; color: #d64a2b; font-family: 'Caveat', cursive; font-size: 19px; font-weight: 700; display: flex; align-items: center; justify-content: center;">2</span><div style="box-sizing: border-box; padding: 10px 12px; background: #ffd9c9; box-shadow: 0 6px 14px rgba(0,0,0,.25); transform: rotate(1.2deg); font-family: 'Caveat', cursive; font-size: 20px; line-height: 1.15; color: #1b1b1b; flex: 1;"><span style="display: block; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .14em; color: #b5452b; margin-bottom: 4px;">P-02</span>Manual calculations often caused lost or inaccurate data.</div></div><div style="display: flex; gap: 10px; align-items: flex-start;"><span style="flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; background: transparent; border: 2px solid #d64a2b; color: #d64a2b; font-family: 'Caveat', cursive; font-size: 19px; font-weight: 700; display: flex; align-items: center; justify-content: center;">3</span><div style="box-sizing: border-box; padding: 10px 12px; background: #d9ecff; box-shadow: 0 6px 14px rgba(0,0,0,.25); transform: rotate(-1deg); font-family: 'Caveat', cursive; font-size: 20px; line-height: 1.15; color: #1b1b1b; flex: 1;"><span style="display: block; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .14em; color: #b5452b; margin-bottom: 4px;">P-03</span>Reporting felt repetitive and disconnected from their actual workflow.</div></div></div></section>
<section id="c2" style="position: relative; width: 100%; box-sizing: border-box; padding: 36px 20px 32px; margin-top: 28px; background-color: #f7f7f4; background-image: repeating-linear-gradient(180deg, transparent 0, transparent 27px, #dfe5ec 27px, #dfe5ec 28px); background-position: 0 18px; border-radius: 4px; box-shadow: 0 10px 24px rgba(60,40,10,.22), 0 5px 0 #e2dccd; display: flex; flex-direction: column; gap: 20px;"><svg aria-hidden="true" width="18" height="44" viewBox="0 0 26 64" fill="none" stroke="#8a8f94" stroke-width="2.4" stroke-linecap="round" style="position: absolute; right: 28px; top: -18px; z-index: 3;"><path d="M8 20 V50 a5 5 0 0 0 10 0 V12 a8 8 0 0 0 -16 0 V46"></path></svg><div style="display: flex;"><span style="display: inline-flex; align-items: center; gap: 8px; padding: 5px 10px; border: 2px solid #b5452b; border-radius: 3px; background: rgba(181,69,43,.07); color: #b5452b; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: .16em; transform: rotate(-2.5deg);"><span>CHAPTER 02</span><span aria-hidden="true" style="width: 1px; align-self: stretch; background: #b5452b; opacity: .6;"></span><span>IN THE FIELD</span></span></div><h2 style="margin: 0; font-size: 30px; line-height: 1.05; letter-spacing: -.02em; font-weight: 800; color: #1b1b1b; max-width: 358px;">Reporting was the <span style="position: relative; display: inline-block; white-space: nowrap;">last<svg aria-hidden="true" viewBox="0 0 120 64" preserveAspectRatio="none" style="position: absolute; left: -8%; top: -18%; width: 116%; height: 136%; overflow: visible; pointer-events: none;"><path d="M10 36 C4 14 58 2 100 10 C124 16 118 52 66 59 C26 64 2 50 14 22" fill="none" stroke="#d64a2b" stroke-width="3" stroke-linecap="round"></path></svg></span> chore of a long visit.</h2><p style="margin: 0; font-size: 16px; line-height: 1.6; color: #3a3a3a; max-width: 358px;">I followed PPLs through their farm visits on site. These four activities fill a single visit:</p><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 14px; margin-top: 12px;"><figure style="position: relative; margin: 0; width: 100%; box-sizing: border-box; padding: 6px; background: #fff; box-shadow: 0 10px 24px rgba(0,0,0,.3); transform: rotate(-2deg); flex-shrink: 0; "><span aria-hidden="true" style="position: absolute; left: 50%; top: -12px; width: 60px; height: 18px; margin-left: -30px; background: rgba(240,232,205,.85); box-shadow: 0 1px 2px rgba(0,0,0,.2); transform: rotate(-3deg); z-index: 3;"></span><img src="images/chickin-r1.jpg" alt="Field officer weighing chickens in a coop" style="display: block; width: 100%; height: auto;"><figcaption style="padding: 6px 2px 0; font-family: 'Caveat', cursive; font-size: 20px; line-height: 1.1; color: #1b1b1b;">Chicken weight sampling</figcaption></figure><figure style="position: relative; margin: 0; width: 100%; box-sizing: border-box; padding: 6px; background: #fff; box-shadow: 0 10px 24px rgba(0,0,0,.3); transform: rotate(1.5deg); flex-shrink: 0; "><span aria-hidden="true" style="position: absolute; left: 50%; top: -12px; width: 60px; height: 18px; margin-left: -30px; background: rgba(240,232,205,.85); box-shadow: 0 1px 2px rgba(0,0,0,.2); transform: rotate(-3deg); z-index: 3;"></span><img src="images/chickin-r2.jpg" alt="Coop interior during a feed and medicine stock check" style="display: block; width: 100%; height: auto;"><figcaption style="padding: 6px 2px 0; font-family: 'Caveat', cursive; font-size: 20px; line-height: 1.1; color: #1b1b1b;">Checking feed &amp; medicine stock</figcaption></figure><figure style="position: relative; margin: 0; width: 100%; box-sizing: border-box; padding: 6px; background: #fff; box-shadow: 0 10px 24px rgba(0,0,0,.3); transform: rotate(-1deg); flex-shrink: 0; "><span aria-hidden="true" style="position: absolute; left: 50%; top: -12px; width: 60px; height: 18px; margin-left: -30px; background: rgba(240,232,205,.85); box-shadow: 0 1px 2px rgba(0,0,0,.2); transform: rotate(-3deg); z-index: 3;"></span><img src="images/chickin-r3.jpg" alt="Field officer entering data on a phone" style="display: block; width: 100%; height: auto;"><figcaption style="padding: 6px 2px 0; font-family: 'Caveat', cursive; font-size: 20px; line-height: 1.1; color: #1b1b1b;">Performance calculation</figcaption></figure><figure style="position: relative; margin: 0; width: 100%; box-sizing: border-box; padding: 6px; background: #fff; box-shadow: 0 10px 24px rgba(0,0,0,.3); transform: rotate(2deg); flex-shrink: 0; "><span aria-hidden="true" style="position: absolute; left: 50%; top: -12px; width: 60px; height: 18px; margin-left: -30px; background: rgba(240,232,205,.85); box-shadow: 0 1px 2px rgba(0,0,0,.2); transform: rotate(-3deg); z-index: 3;"></span><img src="images/chickin-r4.jpg" alt="Field officer talking with a farmer" style="display: block; width: 100%; height: auto;"><figcaption style="padding: 6px 2px 0; font-family: 'Caveat', cursive; font-size: 20px; line-height: 1.1; color: #1b1b1b;">Farmer consultation</figcaption></figure></div><div style="box-sizing: border-box; padding: 10px 12px; background: #ffd9c9; box-shadow: 0 6px 14px rgba(0,0,0,.25); transform: rotate(-1.5deg); font-family: 'Caveat', cursive; font-size: 20px; line-height: 1.15; color: #1b1b1b; align-self: flex-end; margin-top: 8px;">Reporting comes last,<br>after all of this.</div></section>
<section id="c3" style="position: relative; width: 100%; box-sizing: border-box; padding: 36px 20px 32px; margin-top: 28px; background-color: #f7f7f4; background-image: repeating-linear-gradient(180deg, transparent 0, transparent 27px, #dfe5ec 27px, #dfe5ec 28px); background-position: 0 18px; border-radius: 4px; box-shadow: 0 10px 24px rgba(60,40,10,.22), 0 5px 0 #e2dccd; display: flex; flex-direction: column; gap: 20px;"><svg aria-hidden="true" width="18" height="44" viewBox="0 0 26 64" fill="none" stroke="#8a8f94" stroke-width="2.4" stroke-linecap="round" style="position: absolute; right: 28px; top: -18px; z-index: 3;"><path d="M8 20 V50 a5 5 0 0 0 10 0 V12 a8 8 0 0 0 -16 0 V46"></path></svg><div style="display: flex;"><span style="display: inline-flex; align-items: center; gap: 8px; padding: 5px 10px; border: 2px solid #b5452b; border-radius: 3px; background: rgba(181,69,43,.07); color: #b5452b; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: .16em; transform: rotate(-2.5deg);"><span>CHAPTER 03</span><span aria-hidden="true" style="width: 1px; align-self: stretch; background: #b5452b; opacity: .6;"></span><span>THREE KEY MOVES</span></span></div><h2 style="margin: 0; font-size: 30px; line-height: 1.05; letter-spacing: -.02em; font-weight: 800; color: #1b1b1b; max-width: 358px;">Share Performance, in <span style="position: relative; display: inline-block; white-space: nowrap;">three<svg aria-hidden="true" viewBox="0 0 120 64" preserveAspectRatio="none" style="position: absolute; left: -8%; top: -18%; width: 116%; height: 136%; overflow: visible; pointer-events: none;"><path d="M10 36 C4 14 58 2 100 10 C124 16 118 52 66 59 C26 64 2 50 14 22" fill="none" stroke="#d64a2b" stroke-width="3" stroke-linecap="round"></path></svg></span> moves.</h2><p style="margin: 0; font-size: 16px; line-height: 1.6; color: #3a3a3a; max-width: 358px;">The new feature works inside the flow PPLs already use, instead of adding a new one.</p><div style="display: flex; flex-direction: column; gap: 12px; padding-top: 22px; border-top: 1.5px dashed #c9bda3;"><div style="display: flex; align-items: center; gap: 12px;"><span style="flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; background: transparent; border: 2px solid #d64a2b; color: #d64a2b; font-family: 'Caveat', cursive; font-size: 19px; font-weight: 700; display: flex; align-items: center; justify-content: center;">1</span><h3 style="margin: 0; font-size: 21px; line-height: 1.15; font-weight: 800; color: #1b1b1b;">Put sharing where the data already is.</h3></div><p style="margin: 0; font-size: 16px; line-height: 1.6; color: #3a3a3a; max-width: 358px;">One “Bagikan” button on the Data harian tab, next to the daily entries PPLs already fill in. No new screen to learn: the report starts from the data they just entered.</p><div style="display: flex; flex-wrap: wrap; gap: 8px;"><span style="padding: 3px 10px; border: 1.5px solid #b5452b; border-radius: 999px; color: #b5452b; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .1em;">CONTEXTUAL DESIGN</span><span style="padding: 3px 10px; border: 1.5px solid #b5452b; border-radius: 999px; color: #b5452b; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .1em;">AFFORDANCE</span></div><figure style="position: relative; margin: 0; width: 100%; box-sizing: border-box; padding: 6px; background: #fff; box-shadow: 0 10px 24px rgba(0,0,0,.3); transform: rotate(-0.8deg); flex-shrink: 0; margin-top: 10px;"><span aria-hidden="true" style="position: absolute; left: 50%; top: -12px; width: 60px; height: 18px; margin-left: -30px; background: rgba(240,232,205,.85); box-shadow: 0 1px 2px rgba(0,0,0,.2); transform: rotate(-3deg); z-index: 3;"></span><img src="images/chickin-beforeafter.jpg" alt="Before and after: the daily data screen gains a Share button" style="display: block; width: 100%; height: auto;"></figure><span style="font-family: 'Caveat', cursive; font-size: 20px; color: #9c3a22;">↑ before → after: “Bagikan” beside the daily entries</span></div><div style="display: flex; flex-direction: column; gap: 12px; padding-top: 22px; border-top: 1.5px dashed #c9bda3;"><div style="display: flex; align-items: center; gap: 12px;"><span style="flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; background: transparent; border: 2px solid #d64a2b; color: #d64a2b; font-family: 'Caveat', cursive; font-size: 19px; font-weight: 700; display: flex; align-items: center; justify-content: center;">2</span><h3 style="margin: 0; font-size: 21px; line-height: 1.15; font-weight: 800; color: #1b1b1b;">Choose the days, send to any app.</h3></div><p style="margin: 0; font-size: 16px; line-height: 1.6; color: #3a3a3a; max-width: 358px;">Each daily entry gets a checkbox, with “Pilih semua” for the whole period. The share button only becomes active once something is picked, then the phone’s share sheet opens (WhatsApp, Telegram and more).</p><div style="display: flex; flex-wrap: wrap; gap: 8px;"><span style="padding: 3px 10px; border: 1.5px solid #b5452b; border-radius: 999px; color: #b5452b; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .1em;">USER CONTROL</span><span style="padding: 3px 10px; border: 1.5px solid #b5452b; border-radius: 999px; color: #b5452b; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .1em;">ERROR PREVENTION</span></div><figure style="position: relative; margin: 0; width: 100%; box-sizing: border-box; padding: 6px; background: #fff; box-shadow: 0 10px 24px rgba(0,0,0,.3); transform: rotate(0.8deg); flex-shrink: 0; margin-top: 10px;"><span aria-hidden="true" style="position: absolute; left: 50%; top: -12px; width: 60px; height: 18px; margin-left: -30px; background: rgba(240,232,205,.85); box-shadow: 0 1px 2px rgba(0,0,0,.2); transform: rotate(-3deg); z-index: 3;"></span><img src="images/chickin-screens.jpg" alt="Four screens: tap Share, select daily data, tap Share, choose a platform" style="display: block; width: 100%; height: auto;"></figure><span style="font-family: 'Caveat', cursive; font-size: 20px; color: #9c3a22;">↑ tap Bagikan → select days → Bagikan → choose an app</span></div><div style="display: flex; flex-direction: column; gap: 12px; padding-top: 22px; border-top: 1.5px dashed #c9bda3;"><div style="display: flex; align-items: center; gap: 12px;"><span style="flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; background: transparent; border: 2px solid #d64a2b; color: #d64a2b; font-family: 'Caveat', cursive; font-size: 19px; font-weight: 700; display: flex; align-items: center; justify-content: center;">3</span><h3 style="margin: 0; font-size: 21px; line-height: 1.15; font-weight: 800; color: #1b1b1b;">Let the system do the math.</h3></div><p style="margin: 0; font-size: 16px; line-height: 1.6; color: #3a3a3a; max-width: 358px;">The report puts the farm, location and field officer on top, then mortality and feed use per day. Depletion, body weight, FCR and remaining feed are calculated by the system. Every farm’s report follows the same layout.</p><div style="display: flex; flex-wrap: wrap; gap: 8px;"><span style="padding: 3px 10px; border: 1.5px solid #b5452b; border-radius: 999px; color: #b5452b; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .1em;">CLARITY</span><span style="padding: 3px 10px; border: 1.5px solid #b5452b; border-radius: 999px; color: #b5452b; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .1em;">ERROR PREVENTION</span></div><figure style="position: relative; margin: 0; width: 100%; box-sizing: border-box; padding: 6px; background: #fff; box-shadow: 0 10px 24px rgba(0,0,0,.3); transform: rotate(-0.6deg); flex-shrink: 0; margin-top: 10px;"><span aria-hidden="true" style="position: absolute; left: 50%; top: -12px; width: ap: 6px; padding: 14px 0; border-top: 1px solid #e4dccb;"><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: .14em; color: #6b5a3c;">NO MANUAL FORMULAS</span><span style="font-size: 15px; color: #9a8f7c; text-decoration: line-through; text-decoration-color: #b5452b;">Totals worked out by hand</span><span style="font-size: 17px; font-weight: 700; color: #2a1f10;">→ Depletion and FCR calculated by the system</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 14px 0; border-top: 1px solid #e4dccb;"><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: .14em; color: #6b5a3c;">ONE FORMAT</span><span style="font-size: 15px; color: #9a8f7c; text-decoration: line-through; text-decoration-color: #b5452b;">Free-text WhatsApp messages</span><span style="font-size: 17px; font-weight: 700; color: #2a1f10;">→ The same structured report for every farm</span></div></div><span style="align-self: flex-end; padding: 6px 12px; border: 2px solid #b5452b; color: #b5452b; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; letter-spacing: .16em; transform: rotate(-6deg);">CASE CLOSED</span></section>

<script>(function () {

  var mode = null, cur = null;
  // touch screens (tablets) have no hover: folders open and close on tap, as on mobile

  function pick() { return window.innerWidth < 900 ? 'm' : 'd'; }
  function tpl(m, i) { var t = document.getElementById('v-' + m + '-' + i); return t ? t.content.firstElementChild : null; }
  function scale() {

  }
  function jump() {

    var el = document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (el) el.scrollIntoView();
  }
  function mount() {
    mode = pick(); cur = null;
    app.innerHTML = '';
    app.appendChild(tpl(mode, 0).cloneNode(true));
    scale();
    jump();
    if (typeof spy === 'function') spy();
  }
  // update the live DOM to match a pre-rendered state, keeping elements so CSS transitions run
  function morph(a, b) {
    if (a.nodeType === 3) { if (a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue; return; }
    if (a.nodeType !== 1) return;

    for (i = a.attributes.length - 1; i >= 0; i--) { at = a.attributes[i].name; if (!b.hasAttribute(at)) a.removeAttribute(at); }
    for (i = 0; i < b.attributes.length; i++) { at = b.attributes[i]; if (a.getAttribute(at.name) !== at.value) a.setAttribute(at.name, at.value); }
    var ac = a.childNodes, bc = b.childNodes;
    if (ac.length !== bc.length) { a.innerHTML = b.innerHTML; return; }
    for (i = 0; i < ac.length; i++) {
      if (ac[i].nodeType !== bc[i].nodeType || ac[i].nodeName !== bc[i].nodeName) { a.replaceChild(bc[i].cloneNode(true), ac[i]); }
      else morph(ac[i], bc[i]);
    }
  }
  function setCur(k) {
    if (k === cur) return;
    var n = tpl(mode, k == null ? 0 : k + 1);
    if (!n) return;
    cur = k;
    morph(app.firstElementChild, n);
    spy();
  }
  function idxOf(el, sel) {
    var t = el && el.closest ? el.closest(sel) : null;
    if (!t) return -1;
    return Array.prototype.indexOf.call(app.querySelectorAll(sel), t);
  }
  // the whole folder reacts (desktop hover), like on the canvas; falls back to the tab
  function tabIndex(el) {

    return j >= 0 ? j : idxOf(el, '[data-tab]');

  app.addEventListener('mouseover', function (e) {
    if (mode !== 'd' || touch) return;

  // profile photo: no context menu, drag or long-press save (a light deterrent only)
  function isPhoto(t) { return t && t.tagName === 'IMG' && /elda-photo/.test(t.getAttribute('src') || ''); }
  app.addEventListener('contextmenu', function (e) { if (isPhoto(e.target)) e.preventDefault(); });
  app.addEventListener('dragstart', function (e) { if (isPhoto(e.target)) e.preventDefault(); });
  // header folder tabs: lift the tab of the section being read
  function spy() {
    var tabs = app.querySelectorAll('.tabnav a'); if (!tabs.length) return;

  // mobile contents FAB: close the list after jumping to a section
  app.addEventListener('click', function (e) {
    var l = e.target.closest && e.target.closest('.tocfab a');
