<article style="grid-column: span 9; display: flex; flex-direction: column; padding: 64px 64px 72px; background: #fbfaf5; border-radius: 3px; box-shadow: 0 16px 36px rgba(0,0,0,.4); font-size: 16px; line-height: 1.65; color: #3a3122;">

<section id="s1" style="display: flex; flex-direction: column; gap: 18px;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§01 — OVERVIEW</span>
<h2 style="margin: 0; font-size: 38px; line-height: 1.1; letter-spacing: -.015em; font-weight: 800; color: #2a1f10;">Daily farm reports, typed by hand into WhatsApp.</h2>
<p style="margin: 0;">Field officers (PPL) at Chickin Smartfarm monitor poultry farms and report daily performance metrics such as feed usage, mortality rate and weight gain to both their unit head and the farmers. Previously, these reports were created manually and sent via WhatsApp, leading to data inaccuracies and wasted time.</p>
<p style="margin: 0;">I was responsible for designing a faster, more reliable way for PPLs to share performance reports directly from the Chickin app, minimizing manual errors and improving data consistency.</p>
</section>

<section id="s2" style="display: flex; flex-direction: column; gap: 18px; margin-top: 56px; padding-top: 56px; border-top: 1.5px dashed #c9bda3;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§02 — RESEARCH &amp; OBSERVATION</span>
<h2 style="margin: 0; font-size: 38px; line-height: 1.1; letter-spacing: -.015em; font-weight: 800; color: #2a1f10;">A day in the life of a field officer.</h2>
<p style="margin: 0;">I conducted research by following the PPLs' daily activities on site. These are the activities that fill a single farm visit:</p>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; margin-top: 6px;">
<figure style="margin: 0; display: flex; flex-direction: column; gap: 10px;">
<img src="images/chickin-r1.jpg" alt="Field officer weighing chickens in a coop" style="display: block; width: 100%; height: 230px; object-fit: cover; border: 6px solid #ffffff; box-shadow: 0 5px 12px rgba(40,25,5,.2); box-sizing: border-box; transform: rotate(-1deg);">
<figcaption style="display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 15px; font-weight: 700; color: #2a1f10;">Chicken weight sampling</span><span style="font-size: 13px; line-height: 1.5;">Random weighing to determine weight gain.</span></figcaption>
</figure>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 10px;">
<img src="images/chickin-r2.jpg" alt="Coop interior during a feed and medicine stock check" style="display: block; width: 100%; height: 230px; object-fit: cover; border: 6px solid #ffffff; box-shadow: 0 5px 12px rgba(40,25,5,.2); box-sizing: border-box; transform: rotate(.8deg);">
<figcaption style="display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 15px; font-weight: 700; color: #2a1f10;">Checking feed &amp; medicine stock</span><span style="font-size: 13px; line-height: 1.5;">Matching the stock that was sent against what was received.</span></figcaption>
</figure>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 10px;">
<img src="images/chickin-r3.jpg" alt="Field officer entering data on a phone" style="display: block; width: 100%; height: 230px; object-fit: cover; border: 6px solid #ffffff; box-shadow: 0 5px 12px rgba(40,25,5,.2); box-sizing: border-box; transform: rotate(-.6deg);">
<figcaption style="display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 15px; font-weight: 700; color: #2a1f10;">Performance calculation</span><span style="font-size: 13px; line-height: 1.5;">Daily data input and calculation to track cultivation progress.</span></figcaption>
</figure>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 10px;">
<img src="images/chickin-r4.jpg" alt="Field officer talking with a farmer" style="display: block; width: 100%; height: 230px; object-fit: cover; border: 6px solid #ffffff; box-shadow: 0 5px 12px rgba(40,25,5,.2); box-sizing: border-box; transform: rotate(1deg);">
<figcaption style="display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 15px; font-weight: 700; color: #2a1f10;">Farmer consultation</span><span style="font-size: 13px; line-height: 1.5;">Q&amp;A sessions with farmers about the cultivation.</span></figcaption>
</figure>
</div>

<section id="s3" style="display: flex; flex-direction: column; gap: 18px; margin-top: 56px; padding-top: 56px; border-top: 1.5px dashed #c9bda3;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§03 — KEY PROBLEMS</span>
<h2 style="margin: 0; font-size: 38px; line-height: 1.1; letter-spacing: -.015em; font-weight: 800; color: #2a1f10;">Reporting was the last chore of a long visit.</h2>
<div style="display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 32px; align-items: start; margin-top: 6px;">
<figure style="grid-column: span 4; margin: 0; display: flex; flex-direction: column; gap: 10px;">
<img src="images/chickin-wa.jpg" alt="A performance report typed out in a WhatsApp chat" style="display: block; width: 100%; height: auto; border: 6px solid #ffffff; box-shadow: 0 5px 12px rgba(40,25,5,.2); box-sizing: border-box;">
<figcaption style="display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 15px; font-weight: 700; color: #2a1f10;">Performance reporting, before</span><span style="font-size: 13px; line-height: 1.5;">Report details typed out and sent to WhatsApp.</span></figcaption>
</figure>
<div style="grid-column: span 8; display: flex; flex-direction: column; gap: 14px;">
<p style="margin: 0;">From observations and interviews, we found the key problems of this case:</p>
<div style="display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; gap: 14px; padding: 18px 20px; background: #fffdf7; border: 1px solid #d8ccb2; border-left: 4px solid #b5452b;"><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; color: #b5452b; padding-top: 3px;">P-01</span><span style="font-size: 15px; line-height: 1.55;">PPLs handle many tasks during on-site visits, such as feed checks, farm consultations and logistics coordination, so reporting becomes a secondary burden.</span></div>
<div style="display: flex; gap: 14px; padding: 18px 20px; background: #fffdf7; border: 1px solid #d8ccb2; border-left: 4px solid #b5452b;"><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; color: #b5452b; padding-top: 3px;">P-02</span><span style="font-size: 15px; line-height: 1.55;">Manual calculations often caused lost or inaccurate data.</span></div>
<div style="display: flex; gap: 14px; padding: 18px 20px; background: #fffdf7; border: 1px solid #d8ccb2; border-left: 4px solid #b5452b;"><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; color: #b5452b; padding-top: 3px;">P-03</span><span style="font-size: 15px; line-height: 1.55;">Reporting felt repetitive and disconnected from their actual workflow.</span></div>
</div>
</div>
</div>
</section>

<section id="s4" style="display: flex; flex-direction: column; gap: 18px; margin-top: 56px; padding-top: 56px; border-top: 1.5px dashed #c9bda3;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§04 — DECISION 1/3 · SHARE BUTTON</span>
<h2 style="margin: 0; font-size: 36px; line-height: 1.14; letter-spacing: -.015em; font-weight: 800; color: #2a1f10;">Put sharing where the data already is.</h2>
<p style="margin: 0;">The new Share Performance feature starts with one “Bagikan” button on the Data harian tab, next to the daily entries PPLs already fill in during a visit. There is no new screen to learn: the report starts from the data they just entered, instead of being retyped into WhatsApp.</p>
<div style="display: flex; flex-wrap: wrap; gap: 6px;"><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Contextual Design</span><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Affordance</span></div>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0;"><img src="images/chickin-beforeafter.jpg" alt="Before and after: the daily data screen gains a Share button" style="display: block; width: 100%; height: auto; padding: 10px; background: #ffffff; border: 1px solid #e4dccb; box-sizing: border-box; box-shadow: 0 6px 16px rgba(40,25,5,.12);"><figcaption style="font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.5; color: #6b5a3c;">Before → after: “Bagikan” sits beside the daily entries.</figcaption></figure>
</section>

<section id="s5" style="display: flex; flex-direction: column; gap: 18px; margin-top: 56px; padding-top: 56px; border-top: 1.5px dashed #c9bda3;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§05 — DECISION 2/3 · SELECT & SEND</span>
<h2 style="margin: 0; font-size: 36px; line-height: 1.14; letter-spacing: -.015em; font-weight: 800; color: #2a1f10;">Choose the days, send to any app.</h2>
<p style="margin: 0;">Each daily entry gets a checkbox, with “Pilih semua” for the whole period. The header counts what is selected, and the share button only becomes active once something is picked. The last step opens the phone’s share sheet (WhatsApp, Telegram and more), so reports still reach people where they already talk.</p>
<div style="display: flex; flex-wrap: wrap; gap: 6px;"><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">User Control</span><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Error Prevention</span></div>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0;"><img src="images/chickin-screens.jpg" alt="Four screens: tap Share, select daily data, tap Share, choose a platform" style="display: block; width: 100%; height: auto; padding: 10px; background: #ffffff; border: 1px solid #e4dccb; box-sizing: border-box; box-shadow: 0 6px 16px rgba(40,25,5,.12);"><figcaption style="font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.5; color: #6b5a3c;">Tap Bagikan → select days → Bagikan → choose an app.</figcaption></figure>
</section>

<section id="s6" style="display: flex; flex-direction: column; gap: 18px; margin-top: 56px; padding-top: 56px; border-top: 1.5px dashed #c9bda3;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§06 — DECISION 3/3 · THE REPORT</span>
<h2 style="margin: 0; font-size: 36px; line-height: 1.14; letter-spacing: -.015em; font-weight: 800; color: #2a1f10;">Let the system do the math.</h2>
<p style="margin: 0;">The generated report puts the farm, location and field officer at the top, then mortality and feed use per day. Totals such as depletion, body weight, FCR and remaining feed are calculated by the system, and notes on the chickens and the coop close the page. Every farm’s report follows the same layout, so unit heads and farmers read it the same way.</p>
<div style="display: flex; flex-wrap: wrap; gap: 6px;"><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Clarity</span><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Error Prevention</span></div>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0;"><img src="images/chickin-report.jpg" alt="Two generated performance reports for Wahono Farm" style="display: block; width: 100%; height: auto; padding: 10px; background: #ffffff; border: 1px solid #e4dccb; box-sizing: border-box; box-shadow: 0 6px 16px rgba(40,25,5,.12);"><figcaption style="font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.5; color: #6b5a3c;">A generated two-page report for Wahono Farm.</figcaption></figure>
</section>

<section id="s7" style="display: flex; flex-direction: column; gap: 18px; margin-top: 56px; padding-top: 56px; border-top: 1.5px dashed #c9bda3;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§07 — IMPACT</span>
<h2 style="margin: 0; font-size: 36px; line-height: 1.14; letter-spacing: -.015em; font-weight: 800; color: #2a1f10;">Less typing, fewer mistakes.</h2>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px;"><div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; background: #fffdf7; border: 1px solid #d8ccb2; border-top: 4px solid #1f3a68; font-size: 14px; line-height: 1.55;"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .12em; color: #1f3a68;">ENTER ONCE</span><span>Data recorded during the visit becomes the report. Nothing has to be typed twice into a chat.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; background: #fffdf7; border: 1px solid #d8ccb2; border-top: 4px solid #1f3a68; font-size: 14px; line-height: 1.55;"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .12em; color: #1f3a68;">NO MANUAL FORMULAS</span><span>Totals like depletion and FCR come from the system, removing a common source of calculation mistakes.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; background: #fffdf7; border: 1px solid #d8ccb2; border-top: 4px solid #1f3a68; font-size: 14px; line-height: 1.55;"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .12em; color: #1f3a68;">ONE FORMAT</span><span>Unit heads and farmers receive the same structured report for every farm, so it is quicker to read and compare.</span></div></div>
</section>

<section id="s8" style="display: flex; flex-direction: column; gap: 18px; margin-top: 56px; padding-top: 56px; border-top: 1.5px dashed #c9bda3;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§08 — REFLECTION</span>
<blockquote style="margin: 0; padding: 24px 28px; background: #f3ecdb; border: 1px solid #d8ccb2; font-size: 24px; line-height: 1.4; font-weight: 600; color: #2a1f10;">“Field officers don’t need more screens. They need a smoother way to do the same job with less friction.”</blockquote>
<p style="margin: 0;">Designing for Chickin taught me the value of understanding the context of use.</p>
</section>

<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§01 — OVERVIEW</span>
<h2 style="margin: 0; font-size: 26px; line-height: 1.12; letter-spacing: -.01em; font-weight: 800; color: #2a1f10;">Daily farm reports, typed by hand into WhatsApp.</h2>
<p style="margin: 0;">Field officers (PPL) at Chickin Smartfarm monitor poultry farms and report daily performance metrics such as feed usage, mortality rate and weight gain to both their unit head and the farmers. Previously, these reports were created manually and sent via WhatsApp, leading to data inaccuracies and wasted time.</p>
<p style="margin: 0;">I was responsible for designing a faster, more reliable way for PPLs to share performance reports directly from the Chickin app, minimizing manual errors and improving data consistency.</p>
</section>

<section id="m2" style="display: flex; flex-direction: column; gap: 14px; margin-top: 36px; padding-top: 36px; border-top: 1.5px dashed #c9bda3;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§02 — RESEARCH &amp; OBSERVATION</span>
<h2 style="margin: 0; font-size: 26px; line-height: 1.12; letter-spacing: -.01em; font-weight: 800; color: #2a1f10;">A day in the life of a field officer.</h2>
<p style="margin: 0;">I conducted research by following the PPLs' daily activities on site. These are the activities that fill a single farm visit:</p>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 12px;">
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px;">
<img src="images/chickin-r1.jpg" alt="Field officer weighing chickens in a coop" style="display: block; width: 100%; height: 170px; object-fit: cover; border: 4px solid #ffffff; box-shadow: 0 4px 10px rgba(40,25,5,.2); box-sizing: border-box; transform: rotate(-1deg);">
<figcaption style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 13px; font-weight: 700; line-height: 1.3; color: #2a1f10;">Chicken weight sampling</span><span style="font-size: 12px; line-height: 1.45;">Random weighing to determine weight gain.</span></figcaption>
</figure>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px;">
<img src="images/chickin-r2.jpg" alt="Coop interior during a feed and medicine stock check" style="display: block; width: 100%; height: 170px; object-fit: cover; border: 4px solid #ffffff; box-shadow: 0 4px 10px rgba(40,25,5,.2); box-sizing: border-box; transform: rotate(.8deg);">
<figcaption style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 13px; font-weight: 700; line-height: 1.3; color: #2a1f10;">Checking feed &amp; medicine stock</span><span style="font-size: 12px; line-height: 1.45;">Matching stock sent against stock received.</span></figcaption>
</figure>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px;">
<img src="images/chickin-r3.jpg" alt="Field officer entering data on a phone" style="display: block; width: 100%; height: 170px; object-fit: cover; border: 4px solid #ffffff; box-shadow: 0 4px 10px rgba(40,25,5,.2); box-sizing: border-box; transform: rotate(-.6deg);">
<figcaption style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 13px; font-weight: 700; line-height: 1.3; color: #2a1f10;">Performance calculation</span><span style="font-size: 12px; line-height: 1.45;">Daily data input and calculation of progress.</span></figcaption>
</figure>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px;">
<img src="images/chickin-r4.jpg" alt="Field officer talking with a farmer" style="display: block; width: 100%; height: 170px; object-fit: cover; border: 4px solid #ffffff; box-shadow: 0 4px 10px rgba(40,25,5,.2); box-sizing: border-box; transform: rotate(1deg);">
<figcaption style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 13px; font-weight: 700; line-height: 1.3; color: #2a1f10;">Farmer consultation</span><span style="font-size: 12px; line-height: 1.45;">Q&amp;A with farmers about the cultivation.</span></figcaption>
</figure>
</div>
</section>

<section id="m3" style="display: flex; flex-direction: column; gap: 14px; margin-top: 36px; padding-top: 36px; border-top: 1.5px dashed #c9bda3;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§03 — KEY PROBLEMS</span>
<h2 style="margin: 0; font-size: 26px; line-height: 1.12; letter-spacing: -.01em; font-weight: 800; color: #2a1f10;">Reporting was the last chore of a long visit.</h2>
<figure style="margin: 0 auto; width: 220px; display: flex; flex-direction: column; gap: 8px;">
<img src="images/chickin-wa.jpg" alt="A performance report typed out in a WhatsApp chat" style="display: block; width: 100%; height: auto; border: 4px solid #ffffff; box-shadow: 0 4px 10px rgba(40,25,5,.2); box-sizing: border-box;">
<figcaption style="font-size: 12px; line-height: 1.45; text-align: center;"><strong style="color: #2a1f10;">Before:</strong> report details typed out and sent to WhatsApp.</figcaption>
</figure>
<p style="margin: 0;">From observations and interviews, we found the key problems of this case:</p>
<div style="display: flex; flex-direction: column; gap: 10px;">
<div style="display: flex; gap: 12px; padding: 14px 16px; background: #fffdf7; border: 1px solid #d8ccb2; border-left: 4px solid #b5452b;"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; color: #b5452b; padding-top: 3px;">P-01</span><span style="font-size: 14px; line-height: 1.55;">PPLs juggle feed checks, farm consultations and logistics on site, so reporting becomes a secondary burden.</span></div>
<div style="display: flex; gap: 12px; padding: 14px 16px; background: #fffdf7; border: 1px solid #d8ccb2; border-left: 4px solid #b5452b;"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; color: #b5452b; padding-top: 3px;">P-02</span><span style="font-size: 14px; line-height: 1.55;">Manual calculations often caused lost or inaccurate data.</span></div>
<div style="display: flex; gap: 12px; padding: 14px 16px; background: #fffdf7; border: 1px solid #d8ccb2; border-left: 4px solid #b5452b;"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; color: #b5452b; padding-top: 3px;">P-03</span><span style="font-size: 14px; line-height: 1.55;">Reporting felt repetitive and disconnected from their actual workflow.</span></div>
</div>
</section>

<section id="m4" style="display: flex; flex-direction: column; gap: 14px; margin-top: 36px; padding-top: 36px; border-top: 1.5px dashed #c9bda3;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§04 — DECISION 1/3 · SHARE BUTTON</span>
<h2 style="margin: 0; font-size: 25px; line-height: 1.14; letter-spacing: -.015em; font-weight: 800; color: #2a1f10;">Put sharing where the data already is.</h2>
<p style="margin: 0;">The new Share Performance feature starts with one “Bagikan” button on the Data harian tab, next to the daily entries PPLs already fill in during a visit. There is no new screen to learn: the report starts from the data they just entered, instead of being retyped into WhatsApp.</p>
<div style="display: flex; flex-wrap: wrap; gap: 6px;"><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Contextual Design</span><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Affordance</span></div>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0;"><img src="images/chickin-beforeafter.jpg" alt="Before and after: the daily data screen gains a Share button" style="display: block; width: 100%; height: auto; padding: 6px; background: #ffffff; border: 1px solid #e4dccb; box-sizing: border-box; box-shadow: 0 6px 16px rgba(40,25,5,.12);"><figcaption style="font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.5; color: #6b5a3c;">Before → after: “Bagikan” sits beside the daily entries.</figcaption></figure>
</section>

<section id="m5" style="display: flex; flex-direction: column; gap: 14px; margin-top: 36px; padding-top: 36px; border-top: 1.5px dashed #c9bda3;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§05 — DECISION 2/3 · SELECT & SEND</span>
<h2 style="margin: 0; font-size: 25px; line-height: 1.14; letter-spacing: -.015em; font-weight: 800; color: #2a1f10;">Choose the days, send to any app.</h2>
<p style="margin: 0;">Each daily entry gets a checkbox, with “Pilih semua” for the whole period. The header counts what is selected, and the share button only becomes active once something is picked. The last step opens the phone’s share sheet (WhatsApp, Telegram and more), so reports still reach people where they already talk.</p>
<div style="display: flex; flex-wrap: wrap; gap: 6px;"><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">User Control</span><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Error Prevention</span></div>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0;"><img src="images/chickin-screens.jpg" alt="Four screens: tap Share, select daily data, tap Share, choose a platform" style="display: block; width: 100%; height: auto; padding: 6px; background: #ffffff; border: 1px solid #e4dccb; box-sizing: border-box; box-shadow: 0 6px 16px rgba(40,25,5,.12);"><figcaption style="font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.5; color: #6b5a3c;">Tap Bagikan → select days → Bagikan → choose an app.</figcaption></figure>
</section>

<section id="m6" style="display: flex; flex-direction: column; gap: 14px; margin-top: 36px; padding-top: 36px; border-top: 1.5px dashed #c9bda3;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§06 — DECISION 3/3 · THE REPORT</span>
<h2 style="margin: 0; font-size: 25px; line-height: 1.14; letter-spacing: -.015em; font-weight: 800; color: #2a1f10;">Let the system do the math.</h2>
<p style="margin: 0;">The generated report puts the farm, location and field officer at the top, then mortality and feed use per day. Totals such as depletion, body weight, FCR and remaining feed are calculated by the system, and notes on the chickens and the coop close the page. Every farm’s report follows the same layout, so unit heads and farmers read it the same way.</p>
<div style="display: flex; flex-wrap: wrap; gap: 6px;"><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Clarity</span><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Error Prevention</span></div>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0;"><img src="images/chickin-report.jpg" alt="Two generated performance reports for Wahono Farm" style="display: block; width: 100%; height: auto; padding: 6px; background: #ffffff; border: 1px solid #e4dccb; box-sizing: border-box; box-shadow: 0 6px 16px rgba(40,25,5,.12);"><figcaption style="font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.5; color: #6b5a3c;">A generated two-page report for Wahono Farm.</figcaption></figure>
</section>

<section id="m7" style="display: flex; flex-direction: column; gap: 14px; margin-top: 36px; padding-top: 36px; border-top: 1.5px dashed #c9bda3;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§07 — IMPACT</span>
<h2 style="margin: 0; font-size: 25px; line-height: 1.14; letter-spacing: -.015em; font-weight: 800; color: #2a1f10;">Less typing, fewer mistakes.</h2>
<div style="display: flex; flex-direction: column; gap: 10px;"><div style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; background: #fffdf7; border: 1px solid #d8ccb2; border-top: 4px solid #1f3a68; font-size: 14px; line-height: 1.55;"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .12em; color: #1f3a68;">ENTER ONCE</span><span>Data recorded during the visit becomes the report. Nothing has to be typed twice into a chat.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; background: #fffdf7; border: 1px solid #d8ccb2; border-top: 4px solid #1f3a68; font-size: 14px; line-height: 1.55;"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .12em; color: #1f3a68;">NO MANUAL FORMULAS</span><span>Totals like depletion and FCR come from the system, removing a common source of calculation mistakes.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; background: #fffdf7; border: 1px solid #d8ccb2; border-top: 4px solid #1f3a68; font-size: 14px; line-height: 1.55;"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .12em; color: #1f3a68;">ONE FORMAT</span><span>Unit heads and farmers receive the same structured report for every farm, so it is quicker to read and compare.</span></div></div>
</section>

<section id="m8" style="display: flex; flex-direction: column; gap: 14px; margin-top: 36px; padding-top: 36px; border-top: 1.5px dashed #c9bda3;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§08 — REFLECTION</span>
<blockquote style="margin: 0; padding: 18px; background: #f3ecdb; border: 1px solid #d8ccb2; font-size: 18px; line-height: 1.45; font-weight: 600; color: #2a1f10;">“Field officers don’t need more screens. They need a smoother way to do the same job with less friction.”</blockquote>
<p style="margin: 0;">Designing for Chickin taught me the value of understanding the context of use.</p>
</section>

<script>(function () {
  var app = document.getElementById('app');
  var mode = null, cur = null;
  // touch screens (tablets) have no hover: folders open and close on tap, as on mobile
  var touch = window.matchMedia && window.matchMedia('(hover: none)').matches;
  function pick() { return window.innerWidth < 900 ? 'm' : 'd'; }
  function tpl(m, i) { var t = document.getElementById('v-' + m + '-' + i); return t ? t.content.firstElementChild : null; }
  function scale() {
    var w = mode === 'd' ? 1440 : 390;
    var s = Math.min(window.innerWidth / w, mode === 'd' ? 1 : 1.6);
    app.style.zoom = s;
  }
  function jump() {
    if (!location.hash) return;
    var el = document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (el) el.scrollIntoView();
  }
  function mount() {
    mode = pick(); cur = null;
    app.innerHTML = '';
    app.appendChild(tpl(mode, 0).cloneNode(true));
    scale();
    jump();
    if (typeof spy === 'function') spy();
  }
  // update the live DOM to match a pre-rendered state, keeping elements so CSS transitions run
  function morph(a, b) {
    if (a.nodeType === 3) { if (a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue; return; }
    if (a.nodeType !== 1) return;
    var i, at;
    for (i = a.attributes.length - 1; i >= 0; i--) { at = a.attributes[i].name; if (!b.hasAttribute(at)) a.removeAttribute(at); }
    for (i = 0; i < b.attributes.length; i++) { at = b.attributes[i]; if (a.getAttribute(at.name) !== at.value) a.setAttribute(at.name, at.value); }
    var ac = a.childNodes, bc = b.childNodes;
    if (ac.length !== bc.length) { a.innerHTML = b.innerHTML; return; }
    for (i = 0; i < ac.length; i++) {
      if (ac[i].nodeType !== bc[i].nodeType || ac[i].nodeName !== bc[i].nodeName) { a.replaceChild(bc[i].cloneNode(true), ac[i]); }
      else morph(ac[i], bc[i]);
    }
  }
  function setCur(k) {
    if (k === cur) return;
    var n = tpl(mode, k == null ? 0 : k + 1);
    if (!n) return;
    cur = k;
    morph(app.firstElementChild, n);
    spy();
  }
  function idxOf(el, sel) {
    var t = el && el.closest ? el.closest(sel) : null;
    if (!t) return -1;
    return Array.prototype.indexOf.call(app.querySelectorAll(sel), t);
  }
  // the whole folder reacts (desktop hover), like on the canvas; falls back to the tab
  function tabIndex(el) {
    var j = idxOf(el, '[data-row]');
    return j >= 0 ? j : idxOf(el, '[data-tab]');
  }
  app.addEventListener('mouseover', function (e) {
    if (mode !== 'd' || touch) return;
    var j = tabIndex(e.target);
    if (j >= 0) { setCur(j); return; }
    var zone = e.target.closest && e.target.closest('[data-leave]');
    if (!zone && cur != null) setCur(null);
  });
  app.addEventListener('focusin', function (e) { if (mode === 'd') { var j = tabIndex(e.target); if (j >= 0) setCur(j); } });
  app.addEventListener('click', function (e) {
    var j = tabIndex(e.target);
    if (j < 0) return;
    if (mode === 'd' && !touch) setCur(j); else setCur(cur === j ? null : j);
  });
  document.addEventListener('mouseleave', function () { if (mode === 'd' && !touch && cur != null) setCur(null); });
  // profile photo: no context menu, drag or long-press save (a light deterrent only)
  function isPhoto(t) { return t && t.tagName === 'IMG' && /elda-photo/.test(t.getAttribute('src') || ''); }
  app.addEventListener('contextmenu', function (e) { if (isPhoto(e.target)) e.preventDefault(); });
  app.addEventListener('dragstart', function (e) { if (isPhoto(e.target)) e.preventDefault(); });
  // header folder tabs: lift the tab of the section being read
  function spy() {
    var tabs = app.querySelectorAll('.tabnav a'); if (!tabs.length) return;
    var best = 0, y = window.innerHeight * 0.35;
    for (var i = 0; i < tabs.length; i++) {
      var sec = document.getElementById(tabs[i].getAttribute('href').slice(1));
      if (sec && sec.getBoundingClientRect().top <= y) best = i;
    }
    for (var k = 0; k < tabs.length; k++) tabs[k].className = k === best ? 'on' : '';
  }
  window.addEventListener('scroll', spy, { passive: true });
  // mobile contents FAB: close the list after jumping to a section
  app.addEventListener('click', function (e) {
    var l = e.target.closest && e.target.closest('.tocfab a');
    if (l) { var d = l.closest('details'); if (d) d.removeAttribute('open'); }
  });
  window.addEventListener('hashchange', jump);
  window.addEventListener('resize', function () { if (pick() !== mode) mount(); else scale(); });
  mount();
})();
</script>
