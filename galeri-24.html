<article style="grid-column: span 9; display: flex; flex-direction: column; padding: 64px 64px 72px; background: #fbfaf5; border-radius: 3px; box-shadow: 0 16px 36px rgba(0,0,0,.4); font-size: 16px; line-height: 1.65; color: #3a3122;">

<section id="s1" style="display: flex; flex-direction: column; gap: 18px;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§01 — THE BRIEF</span>
<h2 style="margin: 0; font-size: 36px; line-height: 1.14; letter-spacing: -.015em; font-weight: 800; color: #2a1f10;">A trusted gold brand, giving shoppers their own space online.</h2>
<p style="margin: 0;">Galeri 24 sells gold, jewelry and other precious metals across Indonesia. As its online store grew, shoppers needed one place to follow their orders, keep favorites and see their membership.</p>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px;"><div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; background: #fffdf7; border: 1px solid #d8ccb2; border-top: 4px solid #1f3a68; font-size: 14px; line-height: 1.55;"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .12em; color: #1f3a68;">THE PROBLEM</span><span>Buying gold online asks for trust, so every order status and account detail has to be easy to find and easy to read.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; background: #fffdf7; border: 1px solid #d8ccb2; border-top: 4px solid #1f3a68; font-size: 14px; line-height: 1.55;"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .12em; color: #1f3a68;">MY PART</span><span>I designed the core user panel in 4 weeks: notifications, wishlist, order list, profile, addresses and membership.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; background: #fffdf7; border: 1px solid #d8ccb2; border-top: 4px solid #1f3a68; font-size: 14px; line-height: 1.55;"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .12em; color: #1f3a68;">HOW I WORKED</span><span>I grouped the account features into one panel, set a shared sidebar and status style, then designed the six pages on top of that structure.</span></div></div>
</section>

<section id="sd1" style="display: flex; flex-direction: column; gap: 18px; margin-top: 56px; padding-top: 56px; border-top: 1.5px dashed #c9bda3;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§02 — DECISION 1/5 · NOTIFICATIONS</span>
<h2 style="margin: 0; font-size: 36px; line-height: 1.14; letter-spacing: -.015em; font-weight: 800; color: #2a1f10;">Let the unread count lead the way.</h2>
<p style="margin: 0;">On every panel page, the sidebar shows the shopper’s name, membership tier and an unread count next to Pemberitahuan. Inside, tabs split messages into Semua, Transaksi and Promo, and unread messages keep a tinted background. Each message ends with its next step, such as “Lihat Detail Pesanan”.</p>
<div style="display: flex; flex-wrap: wrap; gap: 6px;"><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Visual Hierarchy</span><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Clarity</span></div>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0;"><img src="images/galeri24-notif-crop.jpg" alt="Galeri 24 notifications page with tabs and tinted unread messages" style="display: block; width: 100%; height: auto; padding: 10px; background: #ffffff; border: 1px solid #e4dccb; box-sizing: border-box; box-shadow: 0 6px 16px rgba(40,25,5,.12);"><figcaption style="font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.5; color: #6b5a3c;">Two unread messages, matching the badge in the sidebar.</figcaption></figure>
</section>

<section id="sd2" style="display: flex; flex-direction: column; gap: 18px; margin-top: 56px; padding-top: 56px; border-top: 1.5px dashed #c9bda3;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§03 — DECISION 2/5 · ORDER LIST</span>
<h2 style="margin: 0; font-size: 36px; line-height: 1.14; letter-spacing: -.015em; font-weight: 800; color: #2a1f10;">Status first, actions that follow the status.</h2>
<p style="margin: 0;">Each order card opens with its date, invoice number and a colored status pill, before the product itself. Filters follow the real stages of an order: Menunggu Pembayaran, Diproses, Dikirim, Diterima, Selesai. Actions change with the status: an unpaid order has no “Lacak Pesanan” yet, while a processed one does.</p>
<div style="display: flex; flex-wrap: wrap; gap: 6px;"><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Clarity</span><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Contextual Design</span></div>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0;"><img src="images/galeri24-orders-crop.jpg" alt="Galeri 24 order list with status filters and colored status pills" style="display: block; width: 100%; height: auto; padding: 10px; background: #ffffff; border: 1px solid #e4dccb; box-sizing: border-box; box-shadow: 0 6px 16px rgba(40,25,5,.12);"><figcaption style="font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.5; color: #6b5a3c;">“Lacak Pesanan” appears only once an order is being processed.</figcaption></figure>
</section>

<section id="sd3" style="display: flex; flex-direction: column; gap: 18px; margin-top: 56px; padding-top: 56px; border-top: 1.5px dashed #c9bda3;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§04 — DECISION 3/5 · WISHLIST</span>
<h2 style="margin: 0; font-size: 36px; line-height: 1.14; letter-spacing: -.015em; font-weight: 800; color: #2a1f10;">Show what’s sold out before the click.</h2>
<p style="margin: 0;">Saved items sit in a simple grid of photo, category, name and price. Out-of-stock items are greyed out and labeled “Stok Habis”, so shoppers don’t open a product they can’t buy. A product count and a sort control help when the list grows.</p>
<div style="display: flex; flex-wrap: wrap; gap: 6px;"><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Error Prevention</span><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Clarity</span></div>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; width: 72%; align-self: center;"><img src="images/galeri24-wishlist-crop.jpg" alt="Galeri 24 wishlist grid with some items marked Stok Habis" style="display: block; width: 100%; height: auto; padding: 10px; background: #ffffff; border: 1px solid #e4dccb; box-sizing: border-box; box-shadow: 0 6px 16px rgba(40,25,5,.12);"><figcaption style="font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.5; color: #6b5a3c;">“Stok Habis” items are dimmed in place, not hidden.</figcaption></figure>
</section>

<section id="sd4" style="display: flex; flex-direction: column; gap: 18px; margin-top: 56px; padding-top: 56px; border-top: 1.5px dashed #c9bda3;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§05 — DECISION 4/5 · PROFILE &amp; ADDRESSES</span>
<h2 style="margin: 0; font-size: 36px; line-height: 1.14; letter-spacing: -.015em; font-weight: 800; color: #2a1f10;">Make the default obvious.</h2>
<p style="margin: 0;">The main address is highlighted, tagged “Utama” and marked by a filled “Alamat Utama” button; every other address offers “Jadikan Utama” instead. Shoppers can tell at a glance where an order will be sent. The profile follows the same idea, keeping personal details and account login in two separate blocks.</p>
<div style="display: flex; flex-wrap: wrap; gap: 6px;"><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Clarity</span><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Error Prevention</span></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; align-items: start;"><figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0;"><img src="images/galeri24-address-crop.jpg" alt="Galeri 24 address list with the main address highlighted" style="display: block; width: 100%; height: auto; padding: 10px; background: #ffffff; border: 1px solid #e4dccb; box-sizing: border-box; box-shadow: 0 6px 16px rgba(40,25,5,.12);"><figcaption style="font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.5; color: #6b5a3c;">Address list: one clear default.</figcaption></figure><figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0;"><img src="images/galeri24-profile-crop.jpg" alt="Galeri 24 profile page with personal and account data in two blocks" style="display: block; width: 100%; height: auto; padding: 10px; background: #ffffff; border: 1px solid #e4dccb; box-sizing: border-box; box-shadow: 0 6px 16px rgba(40,25,5,.12);"><figcaption style="font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.5; color: #6b5a3c;">Profile: personal data and account data apart.</figcaption></figure></div>
</section>

<section id="sd5" style="display: flex; flex-direction: column; gap: 18px; margin-top: 56px; padding-top: 56px; border-top: 1.5px dashed #c9bda3;">

<article style="width: 100%; margin-top: 20px; box-sizing: border-box; display: flex; flex-direction: column; padding: 32px 20px 36px; background: #fbfaf5; border-radius: 3px; box-shadow: 0 12px 28px rgba(0,0,0,.4); font-size: 15px; line-height: 1.65; color: #3a3122;">

<section id="m1" style="display: flex; flex-direction: column; gap: 14px;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§01 — THE BRIEF</span>
<h2 style="margin: 0; font-size: 25px; line-height: 1.14; letter-spacing: -.015em; font-weight: 800; color: #2a1f10;">A trusted gold brand, giving shoppers their own space online.</h2>
<p style="margin: 0;">Galeri 24 sells gold, jewelry and other precious metals across Indonesia. As its online store grew, shoppers needed one place to follow their orders, keep favorites and see their membership.</p>
<div style="display: flex; flex-direction: column; gap: 10px;"><div style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; background: #fffdf7; border: 1px solid #d8ccb2; border-top: 4px solid #1f3a68; font-size: 14px; line-height: 1.55;"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .12em; color: #1f3a68;">THE PROBLEM</span><span>Buying gold online asks for trust, so every order status and account detail has to be easy to find and easy to read.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; background: #fffdf7; border: 1px solid #d8ccb2; border-top: 4px solid #1f3a68; font-size: 14px; line-height: 1.55;"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .12em; color: #1f3a68;">MY PART</span><span>I designed the core user panel in 4 weeks: notifications, wishlist, order list, profile, addresses and membership.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; background: #fffdf7; border: 1px solid #d8ccb2; border-top: 4px solid #1f3a68; font-size: 14px; line-height: 1.55;"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .12em; color: #1f3a68;">HOW I WORKED</span><span>I grouped the account features into one panel, set a shared sidebar and status style, then designed the six pages on top of that structure.</span></div></div>
</section>

<section id="md1" style="display: flex; flex-direction: column; gap: 14px; margin-top: 36px; padding-top: 36px; border-top: 1.5px dashed #c9bda3;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§02 — DECISION 1/5 · NOTIFICATIONS</span>
<h2 style="margin: 0; font-size: 25px; line-height: 1.14; letter-spacing: -.015em; font-weight: 800; color: #2a1f10;">Let the unread count lead the way.</h2>
<p style="margin: 0;">On every panel page, the sidebar shows the shopper’s name, membership tier and an unread count next to Pemberitahuan. Inside, tabs split messages into Semua, Transaksi and Promo, and unread messages keep a tinted background. Each message ends with its next step, such as “Lihat Detail Pesanan”.</p>
<div style="display: flex; flex-wrap: wrap; gap: 6px;"><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Visual Hierarchy</span><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Clarity</span></div>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0;"><img src="images/galeri24-notif-crop.jpg" alt="Galeri 24 notifications page with tabs and tinted unread messages" style="display: block; width: 100%; height: auto; padding: 6px; background: #ffffff; border: 1px solid #e4dccb; box-sizing: border-box; box-shadow: 0 6px 16px rgba(40,25,5,.12);"><figcaption style="font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.5; color: #6b5a3c;">Two unread messages, matching the badge in the sidebar.</figcaption></figure>
</section>

<section id="md2" style="display: flex; flex-direction: column; gap: 14px; margin-top: 36px; padding-top: 36px; border-top: 1.5px dashed #c9bda3;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§03 — DECISION 2/5 · ORDER LIST</span>
<h2 style="margin: 0; font-size: 25px; line-height: 1.14; letter-spacing: -.015em; font-weight: 800; color: #2a1f10;">Status first, actions that follow the status.</h2>
<p style="margin: 0;">Each order card opens with its date, invoice number and a colored status pill, before the product itself. Filters follow the real stages of an order: Menunggu Pembayaran, Diproses, Dikirim, Diterima, Selesai. Actions change with the status: an unpaid order has no “Lacak Pesanan” yet, while a processed one does.</p>
<div style="display: flex; flex-wrap: wrap; gap: 6px;"><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Clarity</span><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Contextual Design</span></div>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0;"><img src="images/galeri24-orders-crop.jpg" alt="Galeri 24 order list with status filters and colored status pills" style="display: block; width: 100%; height: auto; padding: 6px; background: #ffffff; border: 1px solid #e4dccb; box-sizing: border-box; box-shadow: 0 6px 16px rgba(40,25,5,.12);"><figcaption style="font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.5; color: #6b5a3c;">“Lacak Pesanan” appears only once an order is being processed.</figcaption></figure>
</section>

<section id="md3" style="display: flex; flex-direction: column; gap: 14px; margin-top: 36px; padding-top: 36px; border-top: 1.5px dashed #c9bda3;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§04 — DECISION 3/5 · WISHLIST</span>
<h2 style="margin: 0; font-size: 25px; line-height: 1.14; letter-spacing: -.015em; font-weight: 800; color: #2a1f10;">Show what’s sold out before the click.</h2>
<p style="margin: 0;">Saved items sit in a simple grid of photo, category, name and price. Out-of-stock items are greyed out and labeled “Stok Habis”, so shoppers don’t open a product they can’t buy. A product count and a sort control help when the list grows.</p>
<div style="display: flex; flex-wrap: wrap; gap: 6px;"><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Error Prevention</span><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Clarity</span></div>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0;"><img src="images/galeri24-wishlist-crop.jpg" alt="Galeri 24 wishlist grid with some items marked Stok Habis" style="display: block; width: 100%; height: auto; padding: 6px; background: #ffffff; border: 1px solid #e4dccb; box-sizing: border-box; box-shadow: 0 6px 16px rgba(40,25,5,.12);"><figcaption style="font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.5; color: #6b5a3c;">“Stok Habis” items are dimmed in place, not hidden.</figcaption></figure>
</section>

<section id="md4" style="display: flex; flex-direction: column; gap: 14px; margin-top: 36px; padding-top: 36px; border-top: 1.5px dashed #c9bda3;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§05 — DECISION 4/5 · PROFILE & ADDRESSES</span>
<h2 style="margin: 0; font-size: 25px; line-height: 1.14; letter-spacing: -.015em; font-weight: 800; color: #2a1f10;">Make the default obvious.</h2>
<p style="margin: 0;">The main address is highlighted, tagged “Utama” and marked by a filled “Alamat Utama” button; every other address offers “Jadikan Utama” instead. Shoppers can tell at a glance where an order will be sent. The profile follows the same idea, keeping personal details and account login in two separate blocks.</p>

<script>(function () {
