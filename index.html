    var best = 0, y = window.innerHeight * 0.35;
    for (var i = 0; i < tabs.length; i++) {
      var sec = document.getElementById(tabs[i].getAttribute('href').slice(1));
      if (sec && sec.getBoundingClientRect().top <= y) best = i;
    }
    for (var k = 0; k < tabs.length; k++) tabs[k].className = k === best ? 'on' : '';
  }
  window.addEventListener('scroll', spy, { passive: true });
  // mobile contents FAB: close the list after jumping to a section
  app.addEventListener('click', function (e) {
    var l = e.target.closest && e.target.closest('.tocfab a');
    if (l) { var d = l.closest('details'); if (d) d.removeAttribute('open'); }
  });
  window.addEventListener('hashchange', jump);
  window.addEventListener('resize', function () { if (pick() !== mode) mount(); else scale(); });
  mount();

  // tap/click any screenshot to see it full size (pinch/scroll to inspect)
  (function () {
    var st = document.createElement('style');
    st.textContent = 'figure img{cursor:zoom-in}.lbx{position:fixed;inset:0;z-index:9999;background:rgba(20,14,6,.92);overflow:auto;-webkit-overflow-scrolling:touch;display:flex;align-items:flex-start;justify-content:center;padding:56px 12px 24px;box-sizing:border-box;cursor:zoom-out}' +
      '.lbx img{display:block;max-width:none;width:min(1400px,240vw);height:auto;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.5)}@media(min-width:900px){.lbx img{width:min(1400px,94vw)}}' +
      '.lbx button{position:fixed;top:12px;right:12px;min-width:44px;min-height:44px;border:0;border-radius:22px;background:#f4ecd8;color:#2a1f10;font:700 13px/1 "JetBrains Mono",monospace;letter-spacing:.1em;padding:0 16px;cursor:pointer}';
    document.head.appendChild(st);
    var box = null;
    function close() { if (box) { box.remove(); box = null; document.body.style.overflow = ''; } }
    app.addEventListener('click', function (e) {
      var t = e.target;
      if (!t || t.tagName !== 'IMG' || isPhoto(t) || !t.closest('figure') || t.closest('a')) return;
      e.preventDefault(); close();
      box = document.createElement('div'); box.className = 'lbx'; box.setAttribute('role', 'dialog'); box.setAttribute('aria-label', t.alt || 'Image');
      var im = document.createElement('img'); im.src = t.currentSrc || t.src; im.alt = t.alt || ''; var full = t.getAttribute('data-full'); if (full) { var hi = new Image(); hi.onload = function () { im.src = full; }; hi.src = full; }
      var b = document.createElement('button'); b.type = 'button'; b.textContent = 'CLOSE ✕';
      box.appendChild(b); box.appendChild(im); document.body.appendChild(box); document.body.style.overflow = 'hidden';
      box.addEventListener('click', function (ev) { if (ev.target === box || ev.target === b) close(); });
      b.focus();
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
  })();
})();
</script>
</body>
</html>
