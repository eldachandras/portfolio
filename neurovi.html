t-size: 11px; color: #9c3a22;">§08</span>V1 vs V2</a><a class="toc" href="#sref" style="min-height: 40px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #e0d4b8;"><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #9c3a22;">§09</span>Reflection</a></nav>

<p style="margin: 0; font-size: 13px; line-height: 1.5; color: #43392a;">Internal hospital system, so there is no public link. Screens use dummy patient data.</p>

<article style="grid-column: span 9; display: flex; flex-direction: column; padding: 64px 64px 72px; background: #fbfaf5; border-radius: 3px; box-shadow: 0 16px 36px rgba(0,0,0,.4); font-size: 16px; line-height: 1.65; color: #3a3122;">
<section id="s1" style="display: flex; flex-direction: column; gap: 18px;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§01 — THE BRIEF</span>
<h2 style="margin: 0; font-size: 36px; line-height: 1.14; letter-spacing: -.015em; font-weight: 800; color: #2a1f10;">One order, many examinations, one crowded page.</h2>
<p style="margin: 0;">Neurovi is a hospital information system built by Tamtech International. In its radiology module, radiologists open an order, read the images and write their expertise: the findings and the impression. The existing page (V1) handled a whole order as one block.</p>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px;"><div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; background: #fffdf7; border: 1px solid #d8ccb2; border-top: 4px solid #1f3a68; font-size: 14px; line-height: 1.55;"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .12em; color: #1f3a68;">MY PART</span><span>I redesigned the page as V2 in 1 week, following the product brief: dashboard, imaging, expertise input and radiology history, for two roles.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; background: #fffdf7; border: 1px solid #d8ccb2; border-top: 4px solid #1f3a68; font-size: 14px; line-height: 1.55;"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .12em; color: #1f3a68;">SCOPE</span><span>I designed the screens radiographers and radiologists work in every day: the order queue, the imaging view, the result form and the history panel.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; background: #fffdf7; border: 1px solid #d8ccb2; border-top: 4px solid #1f3a68; font-size: 14px; line-height: 1.55;"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .12em; color: #1f3a68;">THE CONSTRAINT</span><span>The hospital’s service flow stayed the same, so the new page had to fit how the radiology team already works, not ask them to change it.</span></div></div>
</section>

<section id="s2" style="display: flex; flex-direction: column; gap: 18px; margin-top: 56px; padding-top: 56px; border-top: 1.5px dashed #c9bda3;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§02 — THE STARTING POINT</span>
<h2 style="margin: 0; font-size: 38px; line-height: 1.12; letter-spacing: -.015em; font-weight: 800; color: #2a1f10;">What V1 looked like.</h2>
<div style="display: grid; grid-template-columns: 6fr 5fr; gap: 32px; align-items: start;"><figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0;"><img src="images/neurovi-v1.jpg" alt="The previous radiology results page: an empty imaging area on the left and all results stacked in one form on the right" style="display: block; width: 100%; height: auto; padding: 8px; background: #ffffff; border: 1px solid #e4dccb; box-sizing: border-box; box-shadow: 0 6px 16px rgba(40,25,5,.12);"><figcaption style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 15px; font-weight: 700; color: #2a1f10;">V1, the previous design</span><span style="font-size: 13px; line-height: 1.5;">Patient and doctor names are blurred.</span></figcaption></figure><div style="display: flex; flex-direction: column; gap: 14px;"><p style="margin: 0;">The brief listed what was getting in the doctors’ way:</p><div style="display: flex; flex-direction: column; gap: 10px;"><div style="display: flex; gap: 14px; padding: 14px 18px; background: #fffdf7; border: 1px solid #d8ccb2; border-left: 4px solid #b5452b;"><span style="flex-shrink: 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; color: #b5452b; padding-top: 3px;">P-01</span><span style="font-size: 15px; line-height: 1.55;">All results of an order sat in one large input area.</span></div><div style="display: flex; gap: 14px; padding: 14px 18px; background: #fffdf7; border: 1px solid #d8ccb2; border-left: 4px solid #b5452b;"><span style="flex-shrink: 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; color: #b5452b; padding-top: 3px;">P-02</span><span style="font-size: 15px; line-height: 1.55;">Imaging and expertise were mixed on the same screen, and doctors had to find the matching image themselves.</span></div><div style="display: flex; gap: 14px; padding: 14px 18px; background: #fffdf7; border: 1px solid #d8ccb2; border-left: 4px solid #b5452b;"><span style="flex-shrink: 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; color: #b5452b; padding-top: 3px;">P-03</span><span style="font-size: 15px; line-height: 1.55;">With more than one radiology item, it was hard to tell the examinations apart.</span></div><div style="display: flex; gap: 14px; padding: 14px 18px; background: #fffdf7; border: 1px solid #d8ccb2; border-left: 4px solid #b5452b;"><span style="flex-shrink: 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; color: #b5452b; padding-top: 3px;">P-04</span><span style="font-size: 15px; line-height: 1.55;">There was no way to compare with previous results.</span></div><div style="display: flex; gap: 14px; padding: 14px 18px; background: #fffdf7; border: 1px solid #d8ccb2; border-left: 4px solid #b5452b;"><span style="flex-shrink: 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; color: #b5452b; padding-top: 3px;">P-05</span><span style="font-size: 15px; line-height: 1.55;">The page closed as soon as the doctor pressed Save.</span></div></div></div></div>
</section>
<section id="sd1" style="display: flex; flex-direction: column; gap: 18px; margin-top: 56px; padding-top: 56px; border-top: 1.5px dashed #c9bda3;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§03 — DECISION 1/5 · DASHBOARD</span>
<h2 style="margin: 0; font-size: 36px; line-height: 1.14; letter-spacing: -.015em; font-weight: 800; color: #2a1f10;">Sort the queue by the stage of the work.</h2>
<p style="margin: 0;">Tabs follow the real stages of an order, from Belum Dikonfirmasi to Menunggu Expertise and Selesai, each with a count. Every row shows the examination, its priority (Routine, CITO, STAT) and its status, so radiologists find their queue as soon as they open the module.&nbsp;</p>
<div style="display: flex; flex-wrap: wrap; gap: 6px;"><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Information Architecture</span><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Error Prevention</span></div>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0;"><img src="images/neurovi-dashboard.jpg" alt="Radiology dashboard on the Menunggu Expertise tab, listing examinations with priority and status" style="display: block; width: 100%; height: auto; padding: 10px; background: #ffffff; border: 1px solid #e4dccb; box-sizing: border-box; box-shadow: 0 6px 16px rgba(40,25,5,.12);"><figcaption style="font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.5; color: #6b5a3c;">The “Menunggu Expertise” tab: the radiologist’s queue.</figcaption></figure>
</section>

<section id="sd2" style="display: flex; flex-direction: column; gap: 18px; margin-top: 56px; padding-top: 56px; border-top: 1.5px dashed #c9bda3;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§04 — DECISION 2/5 · IMAGING</span>
<h2 style="margin: 0; font-size: 36px; line-height: 1.14; letter-spacing: -.015em; font-weight: 800; color: #2a1f10;">Pair a missing image with a way forward.</h2>
<p style="margin: 0;">The radiographer checks PACS from the order. If the images are found, they appear in a large preview with a counter. If not, a banner says so and manual upload stays open, so the examination isn’t stuck waiting on an integration.</p>
<div style="display: flex; flex-wrap: wrap; gap: 6px;"><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Error Prevention</span><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">User Control</span></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; align-items: start;"><figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0;"><img src="images/neurovi-pacs.jpg" alt="Imaging found in PACS, shown in a large preview" style="display: block; width: 100%; height: auto; padding: 10px; background: #ffffff; border: 1px solid #e4dccb; box-sizing: border-box; box-shadow: 0 6px 16px rgba(40,25,5,.12);"><figcaption style="font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.5; color: #6b5a3c;">Found in PACS: preview, fullscreen, delete.</figcaption></figure><figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0;"><img src="images/neurovi-nopacs.jpg" alt="Banner saying the imaging is not in PACS yet, with manual upload available" style="display: block; width: 100%; height: auto; padding: 10px; background: #ffffff; border: 1px solid #e4dccb; box-sizing: border-box; box-shadow: 0 6px 16px rgba(40,25,5,.12);"><figcaption style="font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.5; color: #6b5a3c;">Not in PACS yet: manual upload as fallback.</figcaption></figure></div>
</section>

<section id="sd3" style="display: flex; flex-direction: column; gap: 18px; margin-top: 56px; padding-top: 56px; border-top: 1.5px dashed #c9bda3;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§05 — DECISION 3/5 · ROLES</span>
<h2 style="margin: 0; font-size: 36px; line-height: 1.14; letter-spacing: -.015em; font-weight: 800; color: #2a1f10;">Lock what the role shouldn’t touch.</h2>
<p style="margin: 0;">Radiographers and doctors work on the same page with different rights. For the radiographer, findings and impression stay locked; for doctors, edit rights follow the radiologist assigned to the examination. One page serves both roles without one overwriting the other’s work.</p>
<div style="display: flex; flex-wrap: wrap; gap: 6px;"><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Error Prevention</span><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Contextual Design</span></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px;"><div style="display: flex; flex-direction: column; gap: 8px; padding: 18px; background: #fffdf7; border: 1px solid #d8ccb2; border-top: 4px solid #1f3a68; font-size: 14px; line-height: 1.5;"><span style="font-size: 16px; font-weight: 700; color: #2a1f10;">Radiographer view</span><span>Checks PACS or uploads the images. Findings and impression are locked.</span></div><div style="display: flex; flex-direction: column; gap: 8px; padding: 18px; background: #fffdf7; border: 1px solid #d8ccb2; border-top: 4px solid #1f3a68; font-size: 14px; line-height: 1.5;"><span style="font-size: 16px; font-weight: 700; color: #2a1f10;">Doctor view</span><span>Reads the images and writes findings and impression. Edit rights follow the assigned radiologist, who marks the examination as done.</span></div></div>
</section>

<section id="sd4" style="display: flex; flex-direction: column; gap: 18px; margin-top: 56px; padding-top: 56px; border-top: 1.5px dashed #c9bda3;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§06 — DECISION 4/5 · EXPERTISE</span>
<h2 style="margin: 0; font-size: 36px; line-height: 1.14; letter-spacing: -.015em; font-weight: 800; color: #2a1f10;">One examination, one result, one finish button.</h2>
<p style="margin: 0;">Each examination keeps its own image, assigned radiologist and two separate, required fields: Hasil Pemeriksaan (findings) and Kesan (impression). “Tandai Selesai” finishes that examination alone; the page stays open with a confirmation and the status moves from Diproses to Selesai, so the doctor can still review what was written.</p>
<div style="display: flex; flex-wrap: wrap; gap: 6px;"><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Clarity</span><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Microinteractions</span></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; align-items: start;"><figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0;"><img src="images/neurovi-filled.jpg" alt="Doctor view with findings and impression filled in, status Diproses" style="display: block; width: 100%; height: auto; padding: 10px; background: #ffffff; border: 1px solid #e4dccb; box-sizing: border-box; box-shadow: 0 6px 16px rgba(40,25,5,.12);"><figcaption style="font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.5; color: #6b5a3c;">Before finishing · status: Diproses.</figcaption></figure><figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0;"><img src="images/neurovi-done.jpg" alt="The same examination after Tandai Selesai, with a confirmation toast and status Selesai" style="display: block; width: 100%; height: auto; padding: 10px; background: #ffffff; border: 1px solid #e4dccb; box-sizing: border-box; box-shadow: 0 6px 16px rgba(40,25,5,.12);"><figcaption style="font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.5; color: #6b5a3c;">Marked as done · page stays open · Selesai.</figcaption></figure></div>
</section>

<section id="sd5" style="display: flex; flex-direction: column; gap: 18px; margin-top: 56px; padding-top: 56px; border-top: 1.5px dashed #c9bda3;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§07 — DECISION 5/5 · HISTORY</span>
<h2 style="margin: 0; font-size: 36px; line-height: 1.14; letter-spacing: -.015em; font-weight: 800; color: #2a1f10;">Bring past results next to the current one.</h2>
<p style="margin: 0;">V1 had no way to compare results. Now a side panel opens the patient’s radiology history without leaving the page. The doctor picks an earlier examination by date and sees its images and expertise beside the current input.</p>
<div style="display: flex; flex-wrap: wrap; gap: 6px;"><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Contextual Design</span><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">User Control</span></div>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0;"><img src="images/neurovi-compare.jpg" alt="Riwayat Radiologi side panel showing an earlier examination next to the current one" style="display: block; width: 100%; height: auto; padding: 10px; background: #ffffff; border: 1px solid #e4dccb; box-sizing: border-box; box-shadow: 0 6px 16px rgba(40,25,5,.12);"></figure>
</section>

<section id="svs" style="display: flex; flex-direction: column; gap: 18px; margin-top: 56px; padding-top: 56px; border-top: 1.5px dashed #c9bda3;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§08 — V1 VS V2</span>
<h2 style="margin: 0; font-size: 38px; line-height: 1.12; letter-spacing: -.015em; font-weight: 800; color: #2a1f10;">What changed for the doctor.</h2>
<div style="border: 1px solid #d8ccb2; font-size: 14px; line-height: 1.5;"><div style="display: grid; grid-template-columns: 130px 1fr 1fr; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: .1em; color: #6b5a3c;"><span style="padding: 12px 14px; background: #f3ecdb;">ASPECT</span><span style="padding: 12px 14px; background: #f3ecdb; border-left: 1px solid #d8ccb2;">V1 (BEFORE)</span><span style="padding: 12px 14px; background: #e6eef6; color: #1f3a68; border-left: 1px solid #d8ccb2;">V2 (AFTER)</span></div><div style="display: grid; grid-template-columns: 130px 1fr 1fr; border-top: 1px solid #d8ccb2;"><span style="padding: 12px 14px; font-weight: 700; color: #2a1f10;">Structure</span><span style="padding: 12px 14px; border-left: 1px solid #d8ccb2;">All examinations in one input area.</span><span style="padding: 12px 14px; border-left: 1px solid #d8ccb2; background: #f3f7fb; color: #2a1f10;">Each examination handled on its own, with its own radiologist and status.</span></div><div style="display: grid; grid-template-columns: 130px 1fr 1fr; border-top: 1px solid #d8ccb2;"><span style="padding: 12px 14px; font-weight: 700; color: #2a1f10;">Imaging</span><span style="padding: 12px 14px; border-left: 1px solid #d8ccb2;">Uploaded manually; the doctor looks for the right image.</span><span style="padding: 12px 14px; border-left: 1px solid #d8ccb2; background: #f3f7fb; color: #2a1f10;">Checked from PACS, with manual upload as a fallback, shown next to the examination it belongs to.</span></div><div style="display: grid; grid-template-columns: 130px 1fr 1fr; border-top: 1px solid #d8ccb2;"><span style="padding: 12px 14px; font-weight: 700; color: #2a1f10;">Comparison</span><span style="padding: 12px 14px; border-left: 1px solid #d8ccb2;">Not available.</span><span style="padding: 12px 14px; border-left: 1px solid #d8ccb2; background: #f3f7fb; color: #2a1f10;">Past results of the same examination open in a side panel.</span></div><div style="display: grid; grid-template-columns: 130px 1fr 1fr; border-top: 1px solid #d8ccb2;"><span style="padding: 12px 14px; font-weight: 700; color: #2a1f10;">After saving</span><span style="padding: 12px 14px; border-left: 1px solid #d8ccb2;">The page closes.</span><span style="padding: 12px 14px; border-left: 1px solid #d8ccb2; background: #f3f7fb; color: #2a1f10;">The page stays open for review, with a confirmation toast.</span></div><div style="display: grid; grid-template-columns: 130px 1fr 1fr; border-top: 1px solid #d8ccb2;"><span style="padding: 12px 14px; font-weight: 700; color: #2a1f10;">Finishing</span><span style="padding: 12px 14px; border-left: 1px solid #d8ccb2;">No separate finish per examination.</span><span style="padding: 12px 14px; border-left: 1px solid #d8ccb2; background: #f3f7fb; color: #2a1f10;">“Tandai Selesai” on each examination; its status changes to Selesai.</span></div><div style="display: grid; grid-template-columns: 130px 1fr 1fr; border-top: 1px solid #d8ccb2;"><span style="padding: 12px 14px; font-weight: 700; color: #2a1f10;">Data</span><span style="padding: 12px 14px; border-left: 1px solid #d8ccb2;">Results not separated per examination.</span><span style="padding: 12px 14px; border-left: 1px solid #d8ccb2; background: #f3f7fb; color: #2a1f10;">Findings and impression kept apart, ready for SATUSEHAT’s Observation and DiagnosticReport.</span></div></div>
</section>
<section id="sref" style="display: flex; flex-direction: column; gap: 18px; margin-top: 56px; padding-top: 56px; border-top: 1.5px dashed #c9bda3;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§09 — REFLECTION</span>
<blockquote style="margin: 0; padding: 24px 28px; background: #f3ecdb; border: 1px solid #d8ccb2; font-size: 22px; line-height: 1.4; font-weight: 600; color: #2a1f10;">“In a clinical tool, small details carry weight: the right image next to the right examination, a field that is locked for the wrong role, a status you can trust.”</blockquote>
<p style="margin: 0;">The core of this redesign was splitting one crowded page into clear pieces that match how the radiology team already works.</p>
</section>
</article>

<section id="m1" style="display: flex; flex-direction: column; gap: 14px;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§01 — THE BRIEF</span>
<h2 style="margin: 0; font-size: 25px; line-height: 1.14; letter-spacing: -.015em; font-weight: 800; color: #2a1f10;">One order, many examinations, one crowded page.</h2>
<p style="margin: 0;">Neurovi is a hospital information system built by Tamtech International. In its radiology module, radiologists open an order, read the images and write their expertise: the findings and the impression. The existing page (V1) handled a whole order as one block.</p>
<div style="display: flex; flex-direction: column; gap: 10px;"><div style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; background: #fffdf7; border: 1px solid #d8ccb2; border-top: 4px solid #1f3a68; font-size: 14px; line-height: 1.55;"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .12em; color: #1f3a68;">MY PART</span><span>I redesigned the page as V2 in 1 week, following the product brief: dashboard, imaging, expertise input and radiology history, for two roles.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; background: #fffdf7; border: 1px solid #d8ccb2; border-top: 4px solid #1f3a68; font-size: 14px; line-height: 1.55;"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .12em; color: #1f3a68;">SCOPE</span><span>I designed the screens radiographers and radiologists work in every day: the order queue, the imaging view, the result form and the history panel.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; background: #fffdf7; border: 1px solid #d8ccb2; border-top: 4px solid #1f3a68; font-size: 14px; line-height: 1.55;"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .12em; color: #1f3a68;">THE CONSTRAINT</span><span>The hospital’s service flow stayed the same, so the new page had to fit how the radiology team already works, not ask them to change it.</span></div></div>
</section>

<section id="m2" style="display: flex; flex-direction: column; gap: 14px; margin-top: 36px; padding-top: 36px; border-top: 1.5px dashed #c9bda3;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§02 — THE STARTING POINT</span>
<h2 style="margin: 0; font-size: 26px; line-height: 1.12; letter-spacing: -.015em; font-weight: 800; color: #2a1f10;">What V1 looked like.</h2>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0;"><img src="images/neurovi-v1.jpg" alt="The previous radiology results page: an empty imaging area on the left and all results stacked in one form on the right" style="display: block; width: 100%; height: auto; padding: 6px; background: #ffffff; border: 1px solid #e4dccb; box-sizing: border-box; box-shadow: 0 6px 16px rgba(40,25,5,.12);"><figcaption style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 14px; font-weight: 700; color: #2a1f10;">V1, the previous design</span><span style="font-size: 13px; line-height: 1.5;">Patient and doctor names are blurred.</span></figcaption></figure>
<p style="margin: 0;">The brief listed what was getting in the doctors’ way:</p>
<div style="display: flex; flex-direction: column; gap: 10px;"><div style="display: flex; gap: 14px; padding: 12px 14px; background: #fffdf7; border: 1px solid #d8ccb2; border-left: 4px solid #b5452b;"><span style="flex-shrink: 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; color: #b5452b; padding-top: 3px;">P-01</span><span style="font-size: 14px; line-height: 1.55;">All results of an order sat in one large input area.</span></div><div style="display: flex; gap: 14px; padding: 12px 14px; background: #fffdf7; border: 1px solid #d8ccb2; border-left: 4px solid #b5452b;"><span style="flex-shrink: 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; color: #b5452b; padding-top: 3px;">P-02</span><span style="font-size: 14px; line-height: 1.55;">Imaging and expertise were mixed on the same screen, and doctors had to find the matching image themselves.</span></div><div style="display: flex; gap: 14px; padding: 12px 14px; background: #fffdf7; border: 1px solid #d8ccb2; border-left: 4px solid #b5452b;"><span style="flex-shrink: 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; color: #b5452b; padding-top: 3px;">P-03</span><span style="font-size: 14px; line-height: 1.55;">With more than one radiology item, it was hard to tell the examinations apart.</span></div><div style="display: flex; gap: 14px; padding: 12px 14px; background: #fffdf7; border: 1px solid #d8ccb2; border-left: 4px solid #b5452b;"><span style="flex-shrink: 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; color: #b5452b; padding-top: 3px;">P-04</span><span style="font-size: 14px; line-height: 1.55;">There was no way to compare with previous results.</span></div><div style="display: flex; gap: 14px; padding: 12px 14px; background: #fffdf7; border: 1px solid #d8ccb2; border-left: 4px solid #b5452b;"><span style="flex-shrink: 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; color: #b5452b; padding-top: 3px;">P-05</span><span style="font-size: 14px; line-height: 1.55;">The page closed as soon as the doctor pressed Save.</span></div></div>
</section>
<section id="md1" style="display: flex; flex-direction: column; gap: 14px; margin-top: 36px; padding-top: 36px; border-top: 1.5px dashed #c9bda3;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§03 — DECISION 1/5 · DASHBOARD</span>
<h2 style="margin: 0; font-size: 25px; line-height: 1.14; letter-spacing: -.015em; font-weight: 800; color: #2a1f10;">Sort the queue by the stage of the work.</h2>
<p style="margin: 0;">Tabs follow the real stages of an order, from Belum Dikonfirmasi to Menunggu Expertise and Selesai, each with a count. Every row shows the examination, its priority (Routine, CITO, STAT) and its status, so radiologists find their queue as soon as they open the module.</p>
<div style="display: flex; flex-wrap: wrap; gap: 6px;"><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Information Architecture</span><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Error Prevention</span></div>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0;"><img src="images/neurovi-dashboard.jpg" alt="Radiology dashboard on the Menunggu Expertise tab, listing examinations with priority and status" style="display: block; width: 100%; height: auto; padding: 6px; background: #ffffff; border: 1px solid #e4dccb; box-sizing: border-box; box-shadow: 0 6px 16px rgba(40,25,5,.12);"><figcaption style="font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.5; color: #6b5a3c;">The “Menunggu Expertise” tab: the radiologist’s queue.</figcaption></figure>
</section>

<section id="md2" style="display: flex; flex-direction: column; gap: 14px; margin-top: 36px; padding-top: 36px; border-top: 1.5px dashed #c9bda3;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§04 — DECISION 2/5 · IMAGING</span>
<h2 style="margin: 0; font-size: 25px; line-height: 1.14; letter-spacing: -.015em; font-weight: 800; color: #2a1f10;">Pair a missing image with a way forward.</h2>
<p style="margin: 0;">The radiographer checks PACS from the order. If the images are found, they appear in a large preview with a counter. If not, a banner says so and manual upload stays open, so the examination isn’t stuck waiting on an integration.</p>
<div style="display: flex; flex-wrap: wrap; gap: 6px;"><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Error Prevention</span><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">User Control</span></div>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0;"><img src="images/neurovi-pacs.jpg" alt="Imaging found in PACS, shown in a large preview" style="display: block; width: 100%; height: auto; padding: 6px; background: #ffffff; border: 1px solid #e4dccb; box-sizing: border-box; box-shadow: 0 6px 16px rgba(40,25,5,.12);"><figcaption style="font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.5; color: #6b5a3c;">Found in PACS: preview, fullscreen, delete.</figcaption></figure>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0;"><img src="images/neurovi-nopacs.jpg" alt="Banner saying the imaging is not in PACS yet, with manual upload available" style="display: block; width: 100%; height: auto; padding: 6px; background: #ffffff; border: 1px solid #e4dccb; box-sizing: border-box; box-shadow: 0 6px 16px rgba(40,25,5,.12);"><figcaption style="font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.5; color: #6b5a3c;">Not in PACS yet: manual upload as fallback.</figcaption></figure>
</section>

<section id="md3" style="display: flex; flex-direction: column; gap: 14px; margin-top: 36px; padding-top: 36px; border-top: 1.5px dashed #c9bda3;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§05 — DECISION 3/5 · ROLES</span>
<h2 style="margin: 0; font-size: 25px; line-height: 1.14; letter-spacing: -.015em; font-weight: 800; color: #2a1f10;">Lock what the role shouldn’t touch.</h2>
<p style="margin: 0;">Radiographers and doctors work on the same page with different rights. For the radiographer, findings and impression stay locked; for doctors, edit rights follow the radiologist assigned to the examination. One page serves both roles without one overwriting the other’s work.</p>
<div style="display: flex; flex-wrap: wrap; gap: 6px;"><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Error Prevention</span><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Contextual Design</span></div>
<div style="display: flex; flex-direction: column; gap: 14px;"><div style="display: flex; flex-direction: column; gap: 8px; padding: 18px; background: #fffdf7; border: 1px solid #d8ccb2; border-top: 4px solid #1f3a68; font-size: 14px; line-height: 1.5;"><span style="font-size: 16px; font-weight: 700; color: #2a1f10;">Radiographer view</span><span>Checks PACS or uploads the images. Findings and impression are locked.</span></div><div style="display: flex; flex-direction: column; gap: 8px; padding: 18px; background: #fffdf7; border: 1px solid #d8ccb2; border-top: 4px solid #1f3a68; font-size: 14px; line-height: 1.5;"><span style="font-size: 16px; font-weight: 700; color: #2a1f10;">Doctor view</span><span>Reads the images and writes findings and impression. Edit rights follow the assigned radiologist, who marks the examination as done.</span></div></div>
</section>

<section id="md4" style="display: flex; flex-direction: column; gap: 14px; margin-top: 36px; padding-top: 36px; border-top: 1.5px dashed #c9bda3;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§06 — DECISION 4/5 · EXPERTISE</span>
<h2 style="margin: 0; font-size: 25px; line-height: 1.14; letter-spacing: -.015em; font-weight: 800; color: #2a1f10;">One examination, one result, one finish button.</h2>
<p style="margin: 0;">Each examination keeps its own image, assigned radiologist and two separate, required fields: Hasil Pemeriksaan (findings) and Kesan (impression). “Tandai Selesai” finishes that examination alone; the page stays open with a confirmation and the status moves from Diproses to Selesai, so the doctor can still review what was written.</p>
<div style="display: flex; flex-wrap: wrap; gap: 6px;"><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Clarity</span><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Microinteractions</span></div>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0;"><img src="images/neurovi-filled.jpg" alt="Doctor view with findings and impression filled in, status Diproses" style="display: block; width: 100%; height: auto; padding: 6px; background: #ffffff; border: 1px solid #e4dccb; box-sizing: border-box; box-shadow: 0 6px 16px rgba(40,25,5,.12);"><figcaption style="font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.5; color: #6b5a3c;">Before finishing · status: Diproses.</figcaption></figure>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0;"><img src="images/neurovi-done.jpg" alt="The same examination after Tandai Selesai, with a confirmation toast and status Selesai" style="display: block; width: 100%; height: auto; padding: 6px; background: #ffffff; border: 1px solid #e4dccb; box-sizing: border-box; box-shadow: 0 6px 16px rgba(40,25,5,.12);"><figcaption style="font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.5; color: #6b5a3c;">Marked as done · page stays open · Selesai.</figcaption></figure>
</section>

<section id="md5" style="display: flex; flex-direction: column; gap: 14px; margin-top: 36px; padding-top: 36px; border-top: 1.5px dashed #c9bda3;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§07 — DECISION 5/5 · HISTORY</span>
<h2 style="margin: 0; font-size: 25px; line-height: 1.14; letter-spacing: -.015em; font-weight: 800; color: #2a1f10;">Bring past results next to the current one.</h2>
<p style="margin: 0;">V1 had no way to compare results. Now a side panel opens the patient’s radiology history without leaving the page. The doctor picks an earlier examination by date and sees its images and expertise beside the current input.</p>
<div style="display: flex; flex-wrap: wrap; gap: 6px;"><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">Contextual Design</span><span style="padding: 3px 10px; background: #f3ecdb; border: 1px solid #d8ccb2; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #6b5a3c;">User Control</span></div>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0;"><img src="images/neurovi-compare.jpg" alt="Riwayat Radiologi side panel showing an earlier examination next to the current one" style="display: block; width: 100%; height: auto; padding: 6px; background: #ffffff; border: 1px solid #e4dccb; box-sizing: border-box; box-shadow: 0 6px 16px rgba(40,25,5,.12);"></figure>
</section>

<section id="mvs" style="display: flex; flex-direction: column; gap: 14px; margin-top: 36px; padding-top: 36px; border-top: 1.5px dashed #c9bda3;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§08 — V1 VS V2</span>
<h2 style="margin: 0; font-size: 26px; line-height: 1.12; letter-spacing: -.015em; font-weight: 800; color: #2a1f10;">What changed for the doctor.</h2>
<div style="border: 1px solid #d8ccb2; font-size: 14px; line-height: 1.5;"><div style="display: flex; flex-direction: column; gap: 6px; padding: 12px 14px;"><span style="font-weight: 700; color: #2a1f10;">Structure</span><span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; color: #6b5a3c;">V1 · </span>All examinations in one input area.</span><span style="padding: 8px 10px; background: #f3f7fb;"><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; color: #1f3a68;">V2 · </span>Each examination handled on its own, with its own radiologist and status.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-top: 1px solid #d8ccb2;"><span style="font-weight: 700; color: #2a1f10;">Imaging</span><span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; color: #6b5a3c;">V1 · </span>Uploaded manually; the doctor looks for the right image.</span><span style="padding: 8px 10px; background: #f3f7fb;"><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; color: #1f3a68;">V2 · </span>Checked from PACS, with manual upload as a fallback, shown next to the examination it belongs to.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-top: 1px solid #d8ccb2;"><span style="font-weight: 700; color: #2a1f10;">Comparison</span><span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; color: #6b5a3c;">V1 · </span>Not available.</span><span style="padding: 8px 10px; background: #f3f7fb;"><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; color: #1f3a68;">V2 · </span>Past results of the same examination open in a side panel.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-top: 1px solid #d8ccb2;"><span style="font-weight: 700; color: #2a1f10;">After saving</span><span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; color: #6b5a3c;">V1 · </span>The page closes.</span><span style="padding: 8px 10px; background: #f3f7fb;"><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; color: #1f3a68;">V2 · </span>The page stays open for review, with a confirmation toast.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-top: 1px solid #d8ccb2;"><span style="font-weight: 700; color: #2a1f10;">Finishing</span><span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; color: #6b5a3c;">V1 · </span>No separate finish per examination.</span><span style="padding: 8px 10px; background: #f3f7fb;"><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; color: #1f3a68;">V2 · </span>“Tandai Selesai” on each examination; its status changes to Selesai.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-top: 1px solid #d8ccb2;"><span style="font-weight: 700; color: #2a1f10;">Data</span><span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; color: #6b5a3c;">V1 · </span>Results not separated per examination.</span><span style="padding: 8px 10px; background: #f3f7fb;"><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; color: #1f3a68;">V2 · </span>Findings and impression kept apart, ready for SATUSEHAT’s Observation and DiagnosticReport.</span></div></div>
</section>
<section id="mref" style="display: flex; flex-direction: column; gap: 14px; margin-top: 36px; padding-top: 36px; border-top: 1.5px dashed #c9bda3;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .14em; color: #9c3a22;">§09 — REFLECTION</span>
<blockquote style="margin: 0; padding: 18px 18px; background: #f3ecdb; border: 1px solid #d8ccb2; font-size: 18px; line-height: 1.4; font-weight: 600; color: #2a1f10;">“In a clinical tool, small details carry weight: the right image next to the right examination, a field that is locked for the wrong role, a status you can trust.”</blockquote>
<p style="margin: 0;">The core of this redesign was splitting one crowded page into clear pieces that match how the radiology team already works.</p>
</section>
</article>

    var i, at;
    for (i = a.attributes.length - 1; i >= 0; i--) { at = a.attributes[i].name; if (!b.hasAttribute(at)) a.removeAttribute(at); }
    for (i = 0; i < b.attributes.length; i++) { at = b.attributes[i]; if (a.getAttribute(at.name) !== at.value) a.setAttribute(at.name, at.value); }
    var ac = a.childNodes, bc = b.childNodes;
    if (ac.length !== bc.length) { a.innerHTML = b.innerHTML; return; }
    for (i = 0; i < ac.length; i++) {
      if (ac[i].nodeType !== bc[i].nodeType || ac[i].nodeName !== bc[i].nodeName) { a.replaceChild(bc[i].cloneNode(true), ac[i]); }
      else morph(ac[i], bc[i]);
    }
  }
  function setCur(k) {
    if (k === cur) return;
    var n = tpl(mode, k == null ? 0 : k + 1);
    if (!n) return;
    cur = k;
    morph(app.firstElementChild, n);
    spy();
  }
  function idxOf(el, sel) {
    var t = el && el.closest ? el.closest(sel) : null;
    if (!t) return -1;
    return Array.prototype.indexOf.call(app.querySelectorAll(sel), t);
  }
  // the whole folder reacts (desktop hover), like on the canvas; falls back to the tab
  function tabIndex(el) {
    var j = idxOf(el, '[data-row]');
    return j >= 0 ? j : idxOf(el, '[data-tab]');
  }
  app.addEventListener('mouseover', function (e) {
    if (mode !== 'd') return;
    var j = tabIndex(e.target);
    if (j >= 0) { setCur(j); return; }
    var zone = e.target.closest && e.target.closest('[data-leave]');
    if (!zone && cur != null) setCur(null);
  });
  app.addEventListener('focusin', function (e) { if (mode === 'd') { var j = tabIndex(e.target); if (j >= 0) setCur(j); } });
  app.addEventListener('click', function (e) {
    var j = tabIndex(e.target);
    if (j < 0) return;
    if (mode === 'd') setCur(j); else setCur(cur === j ? null : j);
  });
  document.addEventListener('mouseleave', function () { if (mode === 'd' && cur != null) setCur(null); });
  // profile photo: no context menu, drag or long-press save (a light deterrent only)
  function isPhoto(t) { return t && t.tagName === 'IMG' && /elda-photo/.test(t.getAttribute('src') || ''); }
  app.addEventListener('contextmenu', function (e) { if (isPhoto(e.target)) e.preventDefault(); });
  app.addEventListener('dragstart', function (e) { if (isPhoto(e.target)) e.preventDefault(); });
  // header folder tabs: lift the tab of the section being read
  function spy() {
    var tabs = app.querySelectorAll('.tabnav a'); if (!tabs.length) return;
    var best = 0, y = window.innerHeight * 0.35;
    for (var i = 0; i < tabs.length; i++) {
      var sec = document.getElementById(tabs[i].getAttribute('href').slice(1));
      if (sec && sec.getBoundingClientRect().top <= y) best = i;
    }
    for (var k = 0; k < tabs.length; k++) tabs[k].className = k === best ? 'on' : '';
  }
  window.addEventListener('scroll', spy, { passive: true });
  window.addEventListener('hashchange', jump);
  window.addEventListener('resize', function () { if (pick() !== mode) mount(); else scale(); });
  mount();
})();
</script>
</body>
